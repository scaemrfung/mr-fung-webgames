<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Class Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #fdfdfb;
        --surface: #ffffff;
        --surface-2: #eef4f1;
        --ink: #1c2b26;
        --ink-soft: #4d6159;
        --line: #d8e2dc;
        --accent: #0e7c66;
        --accent-strong: #095c4b;
        --accent-ink: #ffffff;
        --coral: #e4572e;
        --coral-soft: #fdeee8;
        --amber: #b97a08;
        --amber-soft: #fdf3dd;
        --preset-bg: #eef4f1;
        --preset-hover: #ddeae3;
        --preset-selected: #0e7c66;
        --preset-selected-ink: #ffffff;
        --bar-track: #e2eae6;
        --bar-fill: #0e7c66;
        --shadow: 0 10px 30px rgba(20, 50, 40, 0.10);
        --focus: #e4572e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10151a;
          --surface: #1a2129;
          --surface-2: #232d38;
          --ink: #f2f5f3;
          --ink-soft: #aebdb6;
          --line: #33404d;
          --accent: #2fbf9b;
          --accent-strong: #57d3b3;
          --accent-ink: #0b2420;
          --coral: #ff8a5f;
          --coral-soft: #3a2620;
          --amber: #ffc44d;
          --amber-soft: #38300f;
          --preset-bg: #232d38;
          --preset-hover: #2d3947;
          --preset-selected: #2fbf9b;
          --preset-selected-ink: #0b2420;
          --bar-track: #2a3541;
          --bar-fill: #2fbf9b;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
          --focus: #ffc44d;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button { font-family: inherit; cursor: pointer; }
      button:focus-visible, input:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      button:disabled { cursor: default; opacity: 0.42; }

      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(12px, 2.4vh, 24px);
        padding: clamp(14px, 3vh, 32px) clamp(14px, 4vw, 40px);
        max-width: 1020px;
        margin: 0 auto;
        position: relative;
      }
      .wrap[hidden] { display: none; }

      /* ---------- teacher passcode gate ---------- */
      .gate-wrap {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(14px, 3vh, 32px) clamp(14px, 4vw, 40px);
      }
      .gate-wrap[hidden] { display: none; }
      .gate-card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: clamp(24px, 5vh, 40px) clamp(20px, 5vw, 36px);
        text-align: center;
      }
      .gate-icon {
        width: 58px; height: 58px;
        margin: 0 auto 14px;
        display: flex; align-items: center; justify-content: center;
        background: var(--surface-2);
        border-radius: 50%;
        color: var(--accent-strong);
      }
      .gate-icon svg { width: 30px; height: 30px; }
      .gate-title {
        font-family: "Fredoka", "Nunito", system-ui, sans-serif;
        font-weight: 600;
        font-size: clamp(1.6rem, 5vw, 2rem);
        margin: 0 0 8px;
      }
      .gate-text {
        margin: 0 0 22px;
        color: var(--ink-soft);
        font-weight: 700;
        font-size: 1rem;
        line-height: 1.45;
      }
      .gate-form { display: flex; flex-direction: column; gap: 12px; }
      .gate-form label {
        position: absolute; width: 1px; height: 1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
      }
      .gate-input {
        width: 100%;
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: 1.5rem;
        letter-spacing: 0.35em;
        text-align: center;
        color: var(--ink);
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 18px;
        padding: 12px 18px;
        min-height: 60px;
      }
      .gate-input::placeholder { color: var(--ink-soft); opacity: 0.6; letter-spacing: 0.1em; font-size: 1.15rem; }
      .gate-btn {
        border: 2px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        border-radius: 18px;
        font-weight: 900;
        font-size: 1.15rem;
        padding: 12px 18px;
        min-height: 58px;
      }
      .gate-btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
      .gate-msg {
        margin: 4px 0 0;
        min-height: 1.4em;
        font-weight: 800;
        font-size: 0.98rem;
        color: var(--coral);
      }

      /* ---------- status pill + sound ---------- */
      .topbar {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-weight: 900;
        font-size: clamp(0.95rem, 2.4vw, 1.15rem);
        color: var(--ink-soft);
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 8px 18px 8px 12px;
      }
      .status .dot {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--ink-soft);
        flex: none;
      }
      .status.running .dot { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
      .status.paused .dot { background: var(--amber); }
      .status.done .dot { background: var(--coral); }
      .status.running { color: var(--accent-strong); border-color: var(--accent); }
      .status.paused { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
      .status.done { color: var(--coral); border-color: var(--coral); background: var(--coral-soft); }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.35); opacity: 0.65; }
      }

      .home-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 900;
        font-size: clamp(0.95rem, 2.4vw, 1.1rem);
        color: var(--accent-ink);
        background: var(--accent);
        border: 2px solid var(--accent);
        border-radius: 999px;
        padding: 9px 20px;
        min-height: 52px;
        text-decoration: none;
        flex: none;
      }
      .home-btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
      .home-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .home-btn svg { width: 24px; height: 24px; flex: none; }
      .topbar .status { margin-right: auto; }
      .sound-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 900;
        font-size: clamp(0.9rem, 2.2vw, 1.05rem);
        color: var(--ink);
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 9px 18px;
        min-height: 48px;
      }
      .sound-btn:hover { border-color: var(--accent); }
      .sound-btn svg { width: 22px; height: 22px; flex: none; }
      .sound-btn .icon-off { display: none; }
      .sound-btn.off .icon-on { display: none; }
      .sound-btn.off .icon-off { display: block; }
      .sound-btn.off { color: var(--ink-soft); }
      .finish-btn .icon-silent { display: none; }
      .finish-btn.silent .icon-loud { display: none; }
      .finish-btn.silent .icon-silent { display: block; }
      .finish-btn.silent { color: var(--ink-soft); }

      /* ---------- big clock ---------- */
      .clock-card {
        width: 100%;
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: clamp(14px, 3.4vh, 34px) clamp(16px, 4vw, 44px) clamp(18px, 3.4vh, 32px);
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .time {
        font-family: "Fredoka", "Nunito", system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(5.2rem, 21vw, 13.5rem);
        line-height: 1;
        letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums;
        margin: 0;
      }
      .time.low { color: var(--coral); animation: lowpulse 1s ease-in-out infinite; }
      @keyframes lowpulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.025); }
      }
      .done-msg {
        display: none;
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: clamp(1.5rem, 5vw, 2.4rem);
        color: var(--coral);
        margin: 2px 0 4px;
      }
      .clock-card.is-done .done-msg { display: block; }
      .clock-card.is-done .time { color: var(--coral); }

      .bar {
        margin-top: clamp(12px, 2.6vh, 24px);
        height: clamp(20px, 3.4vh, 30px);
        background: var(--bar-track);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 100%;
        background: var(--bar-fill);
        border-radius: 999px;
        transition: width 0.25s linear, background-color 0.3s;
      }
      .bar-fill.low { background: var(--coral); }
      .bar-caption {
        margin-top: 9px;
        font-weight: 800;
        font-size: clamp(0.9rem, 2.2vw, 1.05rem);
        color: var(--ink-soft);
        min-height: 1.35em;
      }

      /* confetti pieces (end celebration) */
      .confetti {
        position: absolute; inset: 0;
        pointer-events: none; overflow: hidden;
      }
      .confetti i {
        position: absolute; top: -14px;
        width: 11px; height: 16px; border-radius: 3px;
        animation: fall linear forwards;
      }
      @keyframes fall {
        to { transform: translateY(560px) rotate(620deg); opacity: 0.9; }
      }

      /* ---------- presets ---------- */
      .section-label {
        width: 100%;
        font-weight: 900;
        font-size: clamp(0.95rem, 2.4vw, 1.1rem);
        color: var(--ink-soft);
        margin: 0 0 -4px 2px;
      }
      .presets {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(8px, 1.6vw, 14px);
      }
      .preset {
        border: 2px solid transparent;
        background: var(--preset-bg);
        color: var(--ink);
        border-radius: 18px;
        min-height: clamp(58px, 9vh, 78px);
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: clamp(1.35rem, 4.4vw, 2rem);
        line-height: 1.05;
        padding: 8px 4px;
        transition: background-color 0.15s, transform 0.1s;
      }
      .preset small {
        display: block;
        font-family: "Nunito", sans-serif;
        font-weight: 800;
        font-size: clamp(0.68rem, 1.8vw, 0.8rem);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.75;
        margin-top: 2px;
      }
      .preset:hover:not(:disabled) { background: var(--preset-hover); }
      .preset:active:not(:disabled) { transform: scale(0.97); }
      .preset.selected {
        background: var(--preset-selected);
        color: var(--preset-selected-ink);
      }

      .custom-row {
        width: 100%;
        display: flex;
        gap: clamp(8px, 1.6vw, 14px);
        align-items: stretch;
      }
      .custom-row label {
        position: absolute; width: 1px; height: 1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
      }
      .custom-row input {
        flex: 1 1 auto;
        min-width: 0;
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: clamp(1.2rem, 3.6vw, 1.6rem);
        color: var(--ink);
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 18px;
        padding: 10px 18px;
        min-height: 58px;
      }
      .custom-row input::placeholder { color: var(--ink-soft); opacity: 0.75; }
      .custom-set {
        flex: none;
        border: 2px solid var(--accent);
        background: var(--surface);
        color: var(--accent-strong);
        border-radius: 18px;
        font-weight: 900;
        font-size: clamp(1rem, 3vw, 1.25rem);
        padding: 10px clamp(16px, 3.4vw, 30px);
        min-height: 58px;
      }
      .custom-set:hover:not(:disabled) { background: var(--surface-2); }

      /* ---------- main controls ---------- */
      .controls {
        width: 100%;
        display: grid;
        grid-template-columns: 2fr 1.2fr 1.2fr 1.2fr;
        gap: clamp(8px, 1.6vw, 14px);
      }
      .ctl {
        border-radius: 20px;
        min-height: clamp(62px, 10vh, 84px);
        font-weight: 900;
        font-size: clamp(1.05rem, 3.2vw, 1.5rem);
        padding: 10px 8px;
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        transition: transform 0.1s, background-color 0.15s;
      }
      .ctl:active:not(:disabled) { transform: scale(0.97); }
      .ctl svg { width: 26px; height: 26px; flex: none; }
      .ctl.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        box-shadow: var(--shadow);
      }
      .ctl.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
      .ctl.warn:hover:not(:disabled) { border-color: var(--coral); color: var(--coral); }
      .ctl:not(.primary):hover:not(:disabled) { background: var(--surface-2); }

      .hint {
        margin: 0;
        color: var(--ink-soft);
        font-weight: 700;
        font-size: 0.92rem;
        text-align: center;
      }
      kbd {
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-bottom-width: 3px;
        border-radius: 6px;
        padding: 0 7px;
        font-family: inherit;
        font-weight: 800;
      }

      @media (max-width: 560px) {
        .presets { grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .controls { grid-template-columns: 1fr 1fr; }
        .ctl.primary { grid-column: span 2; }
        .hint { display: none; }
        .time { font-size: clamp(4.6rem, 24vw, 7rem); }
      }
      @media (prefers-reduced-motion: reduce) {
        .status .dot, .time.low { animation: none; }
        .confetti { display: none; }
        .preset, .ctl { transition: none; }
      }
    </style>
  </head>
  <body>
    <section class="gate-wrap" id="gateWrap" aria-labelledby="gateTitle">
      <div class="gate-card">
        <div class="gate-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.2" r="1.4" fill="currentColor" stroke="none"/></svg>
        </div>
        <h1 class="gate-title" id="gateTitle">Teachers Only</h1>
        <p class="gate-text">Please enter the teacher passcode to open the Class Timer.</p>
        <form class="gate-form" id="gateForm" novalidate>
          <label for="gateInput">Teacher passcode</label>
          <input class="gate-input" id="gateInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="Passcode" aria-describedby="gateMsg" />
          <button class="gate-btn" type="submit">Unlock</button>
          <p class="gate-msg" id="gateMsg" role="alert" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <main class="wrap" id="toolWrap" hidden>
      <div class="topbar">
        <a class="home-btn" href="https://scaemrfung.github.io/mr-fung-webgames/" aria-label="Home — back to all games">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.2 12 3.5l9 7.7"/><path d="M5.5 9.8V21h13V9.8"/><path d="M9.8 21v-6.2h4.4V21"/></svg>
          <span>Home</span>
        </a>
        <span class="status" id="statusPill"><span class="dot"></span><span id="statusText">Pick a time to start</span></span>
        <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Toggle sound on or off">
          <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
          <span id="soundLabel">Sound On</span>
        </button>
        <button class="sound-btn finish-btn" id="finishBtn" type="button" aria-pressed="false" aria-label="Toggle silent finish: when silent, time's up shows only a visual celebration with no sound">
          <svg class="icon-loud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
          <svg class="icon-silent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.7 3A6 6 0 0 1 18 8c0 7 3 9 3 9H3s3-2 3-9c0-2 .6-3.9 1.7-5"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          <span id="finishLabel">Finish: Sound</span>
        </button>
      </div>

      <section class="clock-card" id="clockCard" aria-label="Timer display">
        <p class="done-msg" id="doneMsg">Time's up — great work, class!</p>
        <p class="time" id="timeDisplay" role="timer" aria-live="off">5:00</p>
        <div class="bar" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="barTrack">
          <div class="bar-fill" id="barFill"></div>
        </div>
        <p class="bar-caption" id="barCaption">5 minutes ready</p>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
      </section>

      <p class="section-label" id="presetLabel">Choose a time</p>
      <div class="presets" role="group" aria-labelledby="presetLabel">
        <button class="preset" type="button" data-min="1">1<small>minute</small></button>
        <button class="preset" type="button" data-min="2">2<small>minutes</small></button>
        <button class="preset" type="button" data-min="3">3<small>minutes</small></button>
        <button class="preset" type="button" data-min="5">5<small>minutes</small></button>
        <button class="preset" type="button" data-min="10">10<small>minutes</small></button>
        <button class="preset" type="button" data-min="15">15<small>minutes</small></button>
        <button class="preset" type="button" data-min="20">20<small>minutes</small></button>
        <button class="preset" type="button" data-min="30">30<small>minutes</small></button>
      </div>

      <form class="custom-row" id="customForm">
        <label for="customInput">Custom time in minutes</label>
        <input id="customInput" type="number" inputmode="decimal" min="0.5" max="999" step="0.5" placeholder="Custom minutes — e.g. 7" autocomplete="off" />
        <button class="custom-set" id="customSet" type="submit">Set Time</button>
      </form>

      <div class="controls">
        <button class="ctl primary" id="startBtn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.8v14.4c0 .9 1 1.5 1.8 1L20 13a1.2 1.2 0 0 0 0-2L8.8 3.9C8 3.4 7 4 7 4.8z"/></svg>
          <span id="startLabel">Start</span>
        </button>
        <button class="ctl" id="pauseBtn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="pauseIcon"><rect x="5.5" y="4" width="4.6" height="16" rx="1.4"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.4"/></svg>
          <span id="pauseLabel">Pause</span>
        </button>
        <button class="ctl warn" id="resetBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5A9 9 0 1 1 3 13.5"/><path d="M3 3.8v5h5"/></svg>
          <span>Reset</span>
        </button>
        <button class="ctl" id="addBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>1 Min</span>
        </button>
      </div>

      <p class="hint">Tip: press <kbd>Space</kbd> to start, pause, or resume.</p>
    </main>

    <script>
      (function () {
        "use strict";

        /* ---------------- teacher passcode gate ---------------- */
        var GATE_CODE = "4567";
        var gateWrap = document.getElementById("gateWrap");
        var gateForm = document.getElementById("gateForm");
        var gateInput = document.getElementById("gateInput");
        var gateMsg = document.getElementById("gateMsg");
        var toolWrap = document.getElementById("toolWrap");
        gateForm.addEventListener("submit", function (ev) {
          ev.preventDefault();
          if (gateInput.value === GATE_CODE) {
            gateMsg.textContent = "";
            gateWrap.hidden = true;
            toolWrap.hidden = false;
          } else {
            gateMsg.textContent = "That passcode didn't quite match — please try again.";
            gateInput.value = "";
            gateInput.focus();
          }
        });
        gateInput.addEventListener("input", function () {
          if (gateMsg.textContent) gateMsg.textContent = "";
        });
        gateInput.focus();

        var PRESET_DEFAULT = 5; // minutes shown on load

        var timeDisplay = document.getElementById("timeDisplay");
        var barFill = document.getElementById("barFill");
        var barTrack = document.getElementById("barTrack");
        var barCaption = document.getElementById("barCaption");
        var statusPill = document.getElementById("statusPill");
        var statusText = document.getElementById("statusText");
        var clockCard = document.getElementById("clockCard");
        var confettiBox = document.getElementById("confetti");
        var startBtn = document.getElementById("startBtn");
        var startLabel = document.getElementById("startLabel");
        var pauseBtn = document.getElementById("pauseBtn");
        var pauseLabel = document.getElementById("pauseLabel");
        var pauseIcon = document.getElementById("pauseIcon");
        var resetBtn = document.getElementById("resetBtn");
        var addBtn = document.getElementById("addBtn");
        var soundBtn = document.getElementById("soundBtn");
        var soundLabel = document.getElementById("soundLabel");
        var finishBtn = document.getElementById("finishBtn");
        var finishLabel = document.getElementById("finishLabel");
        var customForm = document.getElementById("customForm");
        var customInput = document.getElementById("customInput");
        var customSet = document.getElementById("customSet");
        var presetBtns = Array.prototype.slice.call(document.querySelectorAll(".preset"));

        // state: "idle" | "running" | "paused" | "done"
        var state = "idle";
        var durationMs = PRESET_DEFAULT * 60 * 1000; // chosen length
        var totalMs = durationMs;                   // length of current run (grows with +1 Min)
        var remainingMs = durationMs;
        var endAt = 0;
        var rafId = null;
        var soundOn = true;
        var silentFinish = false;
        var wakeLock = null;

        /* ---------------- formatting ---------------- */
        function fmt(ms) {
          var totalSec = Math.max(0, Math.ceil(ms / 1000));
          var h = Math.floor(totalSec / 3600);
          var m = Math.floor((totalSec % 3600) / 60);
          var s = totalSec % 60;
          function pad(n) { return (n < 10 ? "0" : "") + n; }
          if (h > 0) return h + ":" + pad(m) + ":" + pad(s);
          return m + ":" + pad(s);
        }
        function minsText(ms) {
          var mins = ms / 60000;
          var rounded = Math.round(mins * 10) / 10;
          if (rounded === 1) return "1 minute";
          return (rounded % 1 === 0 ? rounded : rounded.toFixed(1)) + " minutes";
        }

        /* ---------------- rendering ---------------- */
        function render() {
          timeDisplay.textContent = fmt(remainingMs);
          var pct = totalMs > 0 ? Math.max(0, Math.min(100, (remainingMs / totalMs) * 100)) : 0;
          barFill.style.width = pct + "%";
          barTrack.setAttribute("aria-valuenow", String(Math.round(pct)));

          var low = (state === "running" || state === "paused") && remainingMs <= 10000 && remainingMs > 0;
          timeDisplay.classList.toggle("low", low);
          barFill.classList.toggle("low", low || state === "done");

          clockCard.classList.toggle("is-done", state === "done");

          statusPill.className = "status" + (state === "idle" ? "" : " " + state);
          if (state === "idle") statusText.textContent = "Pick a time to start";
          else if (state === "running") statusText.textContent = "Timer running";
          else if (state === "paused") statusText.textContent = "Paused";
          else statusText.textContent = "Time's up!";

          if (state === "idle") barCaption.textContent = minsText(durationMs) + " ready";
          else if (state === "done") barCaption.textContent = "All done — nice work!";
          else barCaption.textContent = fmt(remainingMs) + " left of " + minsText(totalMs);

          // controls per state
          startBtn.disabled = state === "running" || state === "paused";
          startLabel.textContent = state === "done" ? "Start Again" : "Start";
          pauseBtn.disabled = !(state === "running" || state === "paused");
          pauseLabel.textContent = state === "paused" ? "Resume" : "Pause";
          pauseIcon.innerHTML = state === "paused"
            ? '<path d="M7 4.8v14.4c0 .9 1 1.5 1.8 1L20 13a1.2 1.2 0 0 0 0-2L8.8 3.9C8 3.4 7 4 7 4.8z"/>'
            : '<rect x="5.5" y="4" width="4.6" height="16" rx="1.4"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.4"/>';
          var setupLocked = state === "running" || state === "paused";
          presetBtns.forEach(function (b) { b.disabled = setupLocked; });
          customInput.disabled = setupLocked;
          customSet.disabled = setupLocked;
        }

        function markSelectedPreset(mins) {
          presetBtns.forEach(function (b) {
            b.classList.toggle("selected", parseFloat(b.getAttribute("data-min")) === mins);
          });
        }

        /* ---------------- sound (Web Audio, in-browser only) ---------------- */
        var audioCtx = null;
        function ensureAudio() {
          if (!soundOn) return null;
          try {
            if (!audioCtx) {
              var AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return null;
              audioCtx = new AC();
            }
            if (audioCtx.state === "suspended") audioCtx.resume();
            return audioCtx;
          } catch (e) { return null; }
        }
        function tone(ctx, freq, start, dur, type, vol) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = type || "sine";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(vol, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(start); osc.stop(start + dur + 0.05);
        }
        function playHappy() {
          var ctx = ensureAudio();
          if (!ctx) return;
          var t = ctx.currentTime + 0.03;
          // Cheerful rising arpeggio + a bright finish chord: C E G C E G
          var notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
          notes.forEach(function (f, i) { tone(ctx, f, t + i * 0.13, 0.34, "triangle", 0.22); });
          var end = t + notes.length * 0.13;
          [523.25, 659.25, 783.99, 1046.5].forEach(function (f) { tone(ctx, f, end, 0.7, "sine", 0.12); });
        }
        function playClick() {
          var ctx = ensureAudio();
          if (!ctx) return;
          tone(ctx, 880, ctx.currentTime + 0.01, 0.09, "sine", 0.06);
        }

        /* ---------------- confetti ---------------- */
        function celebrate() {
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          confettiBox.innerHTML = "";
          var colors = ["#0e7c66", "#e4572e", "#f2b134", "#3a86ff", "#ef476f", "#06d6a0"];
          for (var i = 0; i < 42; i++) {
            var p = document.createElement("i");
            p.style.left = (Math.random() * 100) + "%";
            p.style.background = colors[i % colors.length];
            p.style.animationDuration = (1.4 + Math.random() * 1.6) + "s";
            p.style.animationDelay = (Math.random() * 0.5) + "s";
            p.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
            if (i % 3 === 0) p.style.borderRadius = "50%";
            confettiBox.appendChild(p);
          }
          setTimeout(function () { confettiBox.innerHTML = ""; }, 4200);
        }

        /* ---------------- wake lock (best effort, projector-friendly) ---------------- */
        function grabWakeLock() {
          try {
            if ("wakeLock" in navigator) {
              navigator.wakeLock.request("screen").then(function (wl) { wakeLock = wl; }).catch(function () {});
            }
          } catch (e) {}
        }
        function dropWakeLock() {
          try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
        }

        /* ---------------- timer engine ---------------- */
        function tick() {
          remainingMs = Math.max(0, endAt - Date.now());
          if (remainingMs <= 0) { finish(); return; }
          render();
          rafId = requestAnimationFrame(tick);
        }
        function stopLoop() {
          if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
        }
        function start() {
          if (state === "running") return;
          if (state === "done" || state === "idle") {
            totalMs = durationMs;
            remainingMs = durationMs;
          }
          ensureAudio(); // unlock audio on this user gesture
          state = "running";
          endAt = Date.now() + remainingMs;
          grabWakeLock();
          stopLoop();
          rafId = requestAnimationFrame(tick);
          render();
        }
        function pause() {
          if (state !== "running") return;
          remainingMs = Math.max(0, endAt - Date.now());
          state = "paused";
          stopLoop();
          dropWakeLock();
          render();
        }
        function resume() {
          if (state !== "paused") return;
          ensureAudio();
          state = "running";
          endAt = Date.now() + remainingMs;
          grabWakeLock();
          stopLoop();
          rafId = requestAnimationFrame(tick);
          render();
        }
        function reset() {
          stopLoop();
          dropWakeLock();
          state = "idle";
          totalMs = durationMs;
          remainingMs = durationMs;
          confettiBox.innerHTML = "";
          render();
        }
        function finish() {
          stopLoop();
          dropWakeLock();
          remainingMs = 0;
          state = "done";
          render();
          if (!silentFinish) playHappy();
          celebrate();
          if (!silentFinish && navigator.vibrate) { try { navigator.vibrate([120, 60, 120]); } catch (e) {} }
        }
        function addMinute() {
          if (state === "running" || state === "paused") {
            totalMs += 60000;
            remainingMs += 60000;
            if (state === "running") endAt += 60000;
            playClick();
            render();
          } else if (state === "idle") {
            durationMs = Math.min(durationMs + 60000, 999 * 60000);
            totalMs = durationMs;
            remainingMs = durationMs;
            markSelectedPreset(durationMs / 60000);
            playClick();
            render();
          } else if (state === "done") {
            durationMs += 60000;
            reset();
          }
        }
        function setDuration(mins) {
          if (state === "running" || state === "paused") return;
          if (!(mins > 0)) return;
          mins = Math.min(mins, 999);
          durationMs = Math.round(mins * 60000);
          totalMs = durationMs;
          remainingMs = durationMs;
          state = "idle";
          markSelectedPreset(mins);
          render();
        }

        /* ---------------- wiring ---------------- */
        presetBtns.forEach(function (b) {
          b.addEventListener("click", function () {
            setDuration(parseFloat(b.getAttribute("data-min")));
            playClick();
          });
        });
        customForm.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var v = parseFloat(customInput.value);
          if (isNaN(v) || v <= 0) {
            customInput.focus();
            return;
          }
          setDuration(v);
          playClick();
          customInput.blur();
        });
        startBtn.addEventListener("click", start);
        pauseBtn.addEventListener("click", function () {
          if (state === "running") pause();
          else if (state === "paused") resume();
        });
        resetBtn.addEventListener("click", reset);
        addBtn.addEventListener("click", addMinute);
        soundBtn.addEventListener("click", function () {
          soundOn = !soundOn;
          soundBtn.classList.toggle("off", !soundOn);
          soundBtn.setAttribute("aria-pressed", String(soundOn));
          soundLabel.textContent = soundOn ? "Sound On" : "Sound Off";
          if (soundOn) playClick();
        });
        finishBtn.addEventListener("click", function () {
          silentFinish = !silentFinish;
          finishBtn.classList.toggle("silent", silentFinish);
          finishBtn.setAttribute("aria-pressed", String(silentFinish));
          finishLabel.textContent = silentFinish ? "Finish: Silent" : "Finish: Sound";
          playClick();
        });
        document.addEventListener("keydown", function (ev) {
          if (toolWrap.hidden) return;
          if (ev.code !== "Space") return;
          var tag = (ev.target && ev.target.tagName) || "";
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
          ev.preventDefault();
          if (state === "running") pause();
          else if (state === "paused") resume();
          else start();
        });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && state === "running") grabWakeLock();
        });

        markSelectedPreset(PRESET_DEFAULT);
        render();
      })();
    </script>
  </body>
</html>
