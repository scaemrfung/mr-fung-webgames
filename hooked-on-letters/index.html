<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Hooked on Letters!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #d9f2ee;
        --panel: #ffffff;
        --panel-edge: #bfe6df;
        --ink: #10333d;
        --ink-soft: #41707d;
        --accent: #ff7a29;
        --accent-dark: #e85f10;
        --teal: #0e7f86;
        --teal-dark: #0a5f66;
        --gold: #ffb400;
        --pond-top: #8fe6ef;
        --pond-mid: #37b3cf;
        --pond-deep: #1b7fa8;
        --sand: #f4d98c;
        --weed: #1f9e6e;
        --shadow: 0 10px 30px rgba(16, 80, 96, 0.18);
        --chip-empty: #eef7f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #07222c;
          --panel: #0e3442;
          --panel-edge: #1c4c5e;
          --ink: #eafcff;
          --ink-soft: #a8cfda;
          --accent: #ff8a3d;
          --accent-dark: #ff7a29;
          --teal: #2bb3ba;
          --teal-dark: #7fd8dc;
          --gold: #ffc61a;
          --pond-top: #3d9db8;
          --pond-mid: #166e8f;
          --pond-deep: #0b4a6e;
          --sand: #7d6535;
          --weed: #157a50;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
          --chip-empty: #123f4f;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Nunito", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      button { font-family: inherit; cursor: pointer; }
      button:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }

      .page {
        max-width: 1240px;
        margin: 0 auto;
        padding: 14px 16px 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ---------- Top bar ---------- */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .modes {
        display: flex;
        background: var(--panel);
        border: 2px solid var(--panel-edge);
        border-radius: 999px;
        padding: 5px;
        gap: 5px;
        box-shadow: var(--shadow);
      }
      .mode-btn {
        border: none;
        background: transparent;
        color: var(--ink-soft);
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: clamp(17px, 2.4vw, 23px);
        padding: 10px 22px;
        border-radius: 999px;
        letter-spacing: 0.01em;
      }
      .mode-btn.active {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 4px 12px rgba(232, 95, 16, 0.35);
      }
      .top-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .tool-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 2px solid var(--panel-edge);
        background: var(--panel);
        color: var(--ink);
        font-weight: 900;
        font-size: clamp(15px, 2vw, 19px);
        padding: 10px 18px;
        border-radius: 999px;
        box-shadow: var(--shadow);
      }
      .tool-btn svg { width: 22px; height: 22px; flex: none; }
      .tool-btn.primary {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      .tool-btn.primary:active { background: var(--teal-dark); }
      .tool-btn:active { transform: translateY(1px); }
      a:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
      .home-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        background: var(--accent);
        border: 2px solid var(--accent);
        color: #fff;
        font-weight: 900;
        font-size: clamp(16px, 2.1vw, 20px);
        padding: 10px 20px;
        border-radius: 999px;
        box-shadow: var(--shadow);
      }
      .home-btn svg { width: 23px; height: 23px; flex: none; }
      .home-btn:active { background: var(--accent-dark); transform: translateY(1px); }

      /* ---------- Target bar ---------- */
      .target-bar {
        background: var(--panel);
        border: 2px solid var(--panel-edge);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }
      .target-left {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      .target-stack { display: flex; flex-direction: column; gap: 2px; }
      .target-label {
        font-weight: 900;
        font-size: clamp(14px, 1.8vw, 18px);
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .target-label .case-letter { text-transform: none; }
      .target-letter {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: clamp(56px, 8vw, 84px);
        line-height: 0.95;
        color: #fff;
        background: var(--accent);
        width: clamp(98px, 12.5vw, 128px);
        height: clamp(76px, 10vw, 104px);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 0 var(--accent-dark), 0 12px 22px rgba(232, 95, 16, 0.3);
        text-shadow: 0 2px 0 rgba(0,0,0,0.15);
      }
      .target-letter.pop { animation: popIn 0.35s ease; }
      @keyframes popIn {
        0% { transform: scale(0.6) rotate(-6deg); }
        60% { transform: scale(1.12) rotate(2deg); }
        100% { transform: scale(1) rotate(0); }
      }
      .hear-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 2px solid var(--panel-edge);
        background: var(--chip-empty);
        color: var(--ink);
        font-weight: 900;
        font-size: 16px;
        padding: 9px 14px;
        border-radius: 999px;
      }
      .hear-btn svg { width: 20px; height: 20px; }
      .target-center { flex: 1 1 260px; min-width: 220px; }
      .word-tiles { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 4px; }
      .tile {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: clamp(28px, 4.4vw, 44px);
        width: clamp(42px, 6vw, 60px);
        height: clamp(52px, 7.4vw, 72px);
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--chip-empty);
        border: 3px dashed var(--panel-edge);
        color: transparent;
      }
      .tile.filled {
        background: var(--teal);
        border: 3px solid var(--teal);
        color: #fff;
        animation: popIn 0.35s ease;
      }
      .tile.next {
        border: 3px dashed var(--accent);
        animation: tilePulse 1.1s ease-in-out infinite;
      }
      @keyframes tilePulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 122, 41, 0.45); }
        50% { box-shadow: 0 0 0 7px rgba(255, 122, 41, 0); }
      }
      .target-right {
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
      }
      .stars { font-size: clamp(24px, 3.4vw, 34px); letter-spacing: 3px; line-height: 1; }
      .stars .on { color: var(--gold); text-shadow: 0 2px 0 rgba(180, 110, 0, 0.35); }
      .stars .off { color: var(--panel-edge); }
      .progress-text { font-weight: 900; font-size: clamp(14px, 1.8vw, 18px); color: var(--ink-soft); }
      .total-stars { font-weight: 900; font-size: 16px; color: var(--ink-soft); }
      .total-stars .big-star { color: var(--gold); font-size: 20px; }

      /* ---------- Pond ---------- */
      .pond {
        position: relative;
        border-radius: 26px;
        overflow: hidden;
        height: clamp(360px, 54vh, 580px);
        background: linear-gradient(180deg, var(--pond-top) 0%, var(--pond-mid) 55%, var(--pond-deep) 100%);
        box-shadow: var(--shadow), inset 0 0 0 3px rgba(255,255,255,0.25);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }
      .pond .sun-glow {
        position: absolute; top: -70px; right: -50px;
        width: 260px; height: 260px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,210,0.5) 0%, rgba(255,255,210,0) 70%);
        pointer-events: none;
      }
      .sand {
        position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
        background: var(--sand);
        border-radius: 50% 50% 0 0 / 18px 18px 0 0;
        opacity: 0.9;
        pointer-events: none;
      }
      .weed { position: absolute; bottom: 12px; pointer-events: none; opacity: 0.85; }
      .weed.left { left: 8px; }
      .weed.right { right: 96px; }
      .bubble {
        position: absolute; bottom: 24px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.65);
        background: rgba(255,255,255,0.18);
        animation: rise linear infinite;
        pointer-events: none;
      }
      @keyframes rise {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: 0.85; }
        100% { transform: translateY(-58vh); opacity: 0; }
      }

      /* Fish */
      .fish {
        position: absolute;
        width: 128px; height: 84px;
        left: 0; top: 0;
        cursor: pointer;
        z-index: 5;
        -webkit-tap-highlight-color: transparent;
      }
      .fish .shake { position: absolute; inset: 0; }
      .fish.wiggling .shake { animation: wiggle 0.5s ease; }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        20% { transform: rotate(-9deg) translateX(-7px); }
        40% { transform: rotate(8deg) translateX(7px); }
        60% { transform: rotate(-7deg) translateX(-5px); }
        80% { transform: rotate(5deg) translateX(5px); }
      }
      .fish .flip { position: absolute; inset: 0; }
      .fish svg.body { width: 100%; height: 100%; display: block; filter: drop-shadow(0 5px 6px rgba(6, 60, 80, 0.35)); }
      .fish .letter {
        position: absolute;
        left: 54%; top: 50%;
        transform: translate(-50%, -54%);
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 50px;
        line-height: 1;
        color: #fff;
        text-shadow: 0 2px 0 rgba(0,0,0,0.28), 0 0 10px rgba(0,0,0,0.12);
        pointer-events: none;
        white-space: nowrap;
      }
      .fish.caught { transition: transform 0.62s cubic-bezier(0.5, -0.1, 0.3, 1), opacity 0.62s ease; z-index: 30; pointer-events: none; }

      /* Hook */
      .hook {
        position: absolute; top: 0; width: 0; z-index: 20;
        opacity: 0; pointer-events: none;
      }
      .hook.show { opacity: 1; }
      .hook .line {
        position: absolute; left: -1.5px; top: 0; width: 3px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
        height: 0;
        transition: height 0.22s ease-in;
      }
      .hook .head {
        position: absolute; left: -9px; width: 18px; height: 22px;
        border: 4px solid #e8f4f6;
        border-top: none;
        border-radius: 0 0 12px 12px;
        top: 0;
        transition: top 0.22s ease-in;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
      }
      .splash-ring {
        position: absolute; border: 3px solid rgba(255,255,255,0.9);
        border-radius: 50%; z-index: 15; pointer-events: none;
        animation: splash 0.55s ease-out forwards;
      }
      @keyframes splash {
        0% { transform: scale(0.25); opacity: 1; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      .drop {
        position: absolute; width: 7px; height: 7px; border-radius: 50%;
        background: rgba(255,255,255,0.95); z-index: 15; pointer-events: none;
        animation: dropFly 0.5s ease-out forwards;
      }
      @keyframes dropFly {
        0% { transform: translate(0,0); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
      }

      /* Compact bucket, top-right corner */
      .bucket-widget.bounce { animation: bucketBounce 0.45s ease; }
      @keyframes bucketBounce {
        0% { transform: scale(1); }
        40% { transform: scale(1.14) rotate(-3deg); }
        100% { transform: scale(1); }
      }

      /* Confetti */
      .confetti {
        position: absolute; top: -14px; width: 11px; height: 16px;
        border-radius: 3px; z-index: 40; pointer-events: none;
        animation: confettiFall linear forwards;
      }
      @keyframes confettiFall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(62vh) rotate(560deg); opacity: 0.7; }
      }

      /* Celebration */
      .celebration {
        position: absolute; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        background: rgba(7, 47, 62, 0.45);
        padding: 16px;
      }
      .celebration[hidden] { display: none; }
      .cele-card {
        background: var(--panel);
        border-radius: 26px;
        padding: 28px 34px;
        text-align: center;
        max-width: 520px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.35);
        animation: popIn 0.4s ease;
      }
      .cele-card .big-stars { font-size: 46px; color: var(--gold); letter-spacing: 6px; text-shadow: 0 3px 0 rgba(180,110,0,0.3); }
      .cele-card h2 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(32px, 5.4vw, 46px); margin: 8px 0 6px; color: var(--ink);
      }
      .cele-card p { font-size: clamp(17px, 2.4vw, 21px); font-weight: 800; color: var(--ink-soft); margin: 0 0 20px; }
      .cele-btn {
        background: var(--accent); color: #fff; border: none;
        font-family: "Fredoka", sans-serif; font-weight: 600;
        font-size: clamp(20px, 3vw, 26px);
        padding: 13px 34px; border-radius: 999px;
        box-shadow: 0 6px 0 var(--accent-dark);
      }
      .cele-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--accent-dark); }

      /* ---------- Bucket (compact, top-right corner) ---------- */
      .bucket-widget {
        background: var(--panel);
        border: 2px solid var(--panel-edge);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 9px 12px 10px;
        display: flex; flex-direction: column; gap: 6px;
        flex: 0 1 268px;
        min-width: 216px;
        margin-left: auto;
      }
      .bucket-title {
        font-family: "Fredoka", sans-serif; font-weight: 600;
        font-size: 19px; line-height: 1;
        display: flex; align-items: center; gap: 7px;
      }
      .bucket-title svg { width: 24px; height: 24px; flex: none; }
      .bucket-count { font-weight: 900; color: var(--ink-soft); font-size: 13px; margin-left: auto; text-align: right; }
      .bucket-chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 30px; align-items: center; }
      .bucket-empty { font-weight: 800; color: var(--ink-soft); font-size: 13.5px; line-height: 1.25; }
      .chip {
        position: relative;
        font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 16.5px;
        color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.25);
        padding: 4px 13px 4px 9px;
        border-radius: 999px 6px 6px 999px;
        animation: popIn 0.3s ease;
        white-space: nowrap;
      }
      .chip::after {
        content: ""; position: absolute; right: -7px; top: 50%;
        transform: translateY(-50%);
        border-top: 7px solid transparent; border-bottom: 7px solid transparent;
        border-left: 8px solid;
        border-left-color: inherit;
      }

      @media (max-width: 640px) {
        .page { padding: 10px 10px 18px; }
        .pond { height: clamp(330px, 50vh, 460px); }
        .fish { width: 100px; height: 66px; }
        .fish .letter { font-size: 38px; }
        .target-right { align-items: flex-start; margin-left: 0; }
        .target-bar { padding: 12px 14px; gap: 12px; }
        .mode-btn { padding: 9px 15px; }
        .weed.right { right: 84px; }
        .bucket-widget { flex: 0 1 268px; margin-left: auto; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bubble, .tile.next { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">

      <header class="topbar">
        <a class="home-btn" href="https://scaemrfung.github.io/mr-fung-webgames/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg>
          Home
        </a>
        <div class="modes" role="group" aria-label="Choose a game">
          <button class="mode-btn active" id="modeCatch" type="button">Catch a Letter</button>
          <button class="mode-btn" id="modeSpell" type="button">Spell a Word</button>
        </div>
        <div class="top-actions">
          <button class="tool-btn" id="soundBtn" type="button" aria-pressed="true">
            <svg id="soundIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
            <svg id="soundIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
            <span id="soundLabel">Sound: On</span>
          </button>
          <button class="tool-btn primary" id="newGameBtn" type="button">New Game</button>
        </div>
        <section class="bucket-widget" id="bucketWidget" aria-label="Bucket of caught fish">
          <div class="bucket-title">
            <svg viewBox="0 0 100 84" aria-hidden="true"><path d="M14 30 L24 78 Q25 84 32 84 L68 84 Q75 84 76 78 L86 30 Z" fill="#e2543e"/><ellipse cx="50" cy="30" rx="36" ry="8" fill="#7ad3e8"/><ellipse cx="50" cy="29" rx="36" ry="8" fill="none" stroke="#b23a26" stroke-width="5"/><path d="M18 28 Q50 -8 82 28" fill="none" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round"/></svg>
            Bucket
            <span class="bucket-count" id="bucketCount"></span>
          </div>
          <div class="bucket-chips" id="bucketChips"><span class="bucket-empty">No fish yet — catch one!</span></div>
        </section>
      </header>

      <section class="target-bar" aria-live="polite">
        <div class="target-left">
          <div class="target-letter" id="targetLetter">B</div>
          <div class="target-stack">
            <span class="target-label" id="targetLabel">Catch the letter</span>
            <button class="hear-btn" id="hearBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
              Hear it
            </button>
          </div>
        </div>
        <div class="target-center" id="wordArea" hidden>
          <span class="target-label">Spell the word</span>
          <div class="word-tiles" id="wordTiles"></div>
        </div>
        <div class="target-right">
          <div class="stars" id="stars" aria-hidden="true"></div>
          <div class="progress-text" id="progressText"></div>
          <div class="total-stars"><span class="big-star">★</span> <span id="totalStars">0</span> caught all together</div>
        </div>
      </section>

      <main class="pond" id="pond" aria-label="Pond. Tap or click the fish with the right letter.">
        <div class="sun-glow"></div>
        <svg class="weed left" width="54" height="86" viewBox="0 0 54 86" aria-hidden="true"><path d="M10 86 C4 60 16 44 8 18 C20 40 16 62 20 86 Z" fill="var(--weed)"/><path d="M28 86 C24 56 36 40 30 8 C42 36 36 60 40 86 Z" fill="var(--weed)" opacity="0.75"/><path d="M44 86 C42 64 50 50 46 30 C54 50 50 66 52 86 Z" fill="var(--weed)" opacity="0.55"/></svg>
        <svg class="weed right" width="44" height="70" viewBox="0 0 54 86" aria-hidden="true"><path d="M12 86 C6 58 18 42 10 14 C22 38 18 62 22 86 Z" fill="var(--weed)"/><path d="M32 86 C28 60 38 46 34 22 C44 44 38 64 42 86 Z" fill="var(--weed)" opacity="0.7"/></svg>
        <div class="sand"></div>
        <div class="hook" id="hook"><div class="line" id="hookLine"></div><div class="head" id="hookHead"></div></div>
        <div class="celebration" id="celebration" hidden>
          <div class="cele-card">
            <div class="big-stars" aria-hidden="true">★ ★ ★</div>
            <h2 id="celeTitle">Great Fishing!</h2>
            <p id="celeText">You caught all the letters!</p>
            <button class="cele-btn" id="celeBtn" type="button">New Round</button>
          </div>
        </div>
      </main>

    </div>

    <script>

          var verb = mode === "catch" ? "Catch" : "Find";
          var caseTxt = nc === "upper" ? "UPPER" : "lower";
          targetLabelEl.innerHTML = verb + " the " + caseTxt + ' case <span class="case-letter">' + dispLetter(need, nc) + "</span>!";
          if (pop) {
            targetLetterEl.classList.remove("pop"); void targetLetterEl.offsetWidth; targetLetterEl.classList.add("pop");
          }
        }
        function pickWord() {
          var w = WORDS[randInt(WORDS.length)];
          if (w === lastWord) w = WORDS[(WORDS.indexOf(w) + 5) % WORDS.length];
          lastWord = w;
          return w;
        }

        /* ---------------- Reset / modes ---------------- */
        function resetGame() {
          busy = false; roundOver = false;
          celebration.hidden = true;
          for (var i = fishes.length - 1; i >= 0; i--) removeFish(fishes[i]);
          fishes = [];
          clearBucket();
          if (mode === "catch") {
            roundCaught = 0;
            targetLetter = randomLetter();
            targetCase = randomCase();
            wordArea.hidden = true;
          } else {
            currentWord = pickWord();
            wordCases = [];
            for (var k = 0; k < currentWord.length; k++) wordCases.push(k === 0 ? "upper" : "lower");
            wordIndex = 0;
            wordArea.hidden = false;
            renderWordTiles();
          }
          updateTargetUI(true);
          renderProgress();
          for (var j = 0; j < FISH_COUNT; j++) spawnFish(false);
          ensureNeededPresent();
        }
        function setMode(m) {
          mode = m;
          document.getElementById("modeCatch").classList.toggle("active", m === "catch");
          document.getElementById("modeSpell").classList.toggle("active", m === "spell");
          resetGame();
          if (m === "catch") speak(targetSpeech());
          else speak("Spell the word " + displayWord() + ". " + targetSpeech());
        }

        /* ---------------- Controls ---------------- */
        document.getElementById("modeCatch").addEventListener("click", function () { interacted = true; initAudio(); if (mode !== "catch") setMode("catch"); });
        document.getElementById("modeSpell").addEventListener("click", function () { interacted = true; initAudio(); if (mode !== "spell") setMode("spell"); });
        document.getElementById("newGameBtn").addEventListener("click", function () { interacted = true; initAudio(); resetGame(); });
        celeBtn.addEventListener("click", function () { interacted = true; initAudio(); resetGame(); });
        document.getElementById("hearBtn").addEventListener("click", function () {
          interacted = true; initAudio();
          if (mode === "catch") speak(targetSpeech());
          else speak("Spell the word " + displayWord() + ". " + targetSpeech());
        });
        var soundBtn = document.getElementById("soundBtn");
        soundBtn.addEventListener("click", function () {
          soundOn = !soundOn;
          interacted = true;
          document.getElementById("soundLabel").textContent = soundOn ? "Sound: On" : "Sound: Off";
          document.getElementById("soundIconOn").style.display = soundOn ? "" : "none";
          document.getElementById("soundIconOff").style.display = soundOn ? "none" : "";
          soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
          if (!soundOn && "speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
          if (soundOn) { initAudio(); tone(660, 0, 0.12, "sine", 0.2); tone(880, 0.1, 0.18, "sine", 0.2); }
        });
        document.addEventListener("pointerdown", function () { interacted = true; initAudio(); }, { once: true });

        /* Bubbles */
        (function makeBubbles() {
          for (var i = 0; i < 9; i++) {
            var b = document.createElement("div");
            b.className = "bubble";
            var size = 8 + Math.random() * 16;
            b.style.width = size + "px"; b.style.height = size + "px";
            b.style.left = (3 + Math.random() * 92) + "%";
            b.style.animationDuration = (6 + Math.random() * 7) + "s";
            b.style.animationDelay = (-Math.random() * 9) + "s";
            pond.insertBefore(b, celebration);
          }
        })();

        resetGame();
        requestAnimationFrame(function (t) { lastTime = t; requestAnimationFrame(step); });
      })();
    </script>
  </body>
</html>
