<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Silly Sentence Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#eef6ff;
        --bg-dot:#d7e9fb;
        --surface:#ffffff;
        --surface-2:#fff7d6;
        --ink:#16233d;
        --muted:#5a6b87;
        --line:#d9e4f2;
        --word-bg:#fff3bf;
        --word-line:#f2c94c;
        --go:#e8482f;
        --go-dark:#c93622;
        --hear:#1f6fe0;
        --hear-dark:#1858b4;
        --read:#e8930c;
        --read-dark:#bd7405;
        --next:#0a9a86;
        --next-dark:#077a6b;
        --neutral:#eef2f7;
        --neutral-ink:#26344d;
        --shadow:0 10px 30px rgba(22,35,61,.12);
        --radius:20px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#0e1626;
          --bg-dot:#16263f;
          --surface:#182740;
          --surface-2:#2a2410;
          --ink:#f2f6fc;
          --muted:#a8b8cf;
          --line:#2c425f;
          --word-bg:#3d3410;
          --word-line:#b8912a;
          --neutral:#22334f;
          --neutral-ink:#e6edf7;
          --shadow:0 10px 30px rgba(0,0,0,.45);
        }
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0}
      body{
        font-family:"Nunito",system-ui,-apple-system,sans-serif;
        background:
          radial-gradient(circle at 12px 12px, var(--bg-dot) 3px, transparent 3.5px) 0 0/34px 34px,
          var(--bg);
        color:var(--ink);
        min-height:100dvh;
      }
      .wrap{
        max-width:980px;
        margin:0 auto;
        padding:16px 16px 28px;
        display:flex;
        flex-direction:column;
        gap:14px;
        min-height:100dvh;
      }

      /* Top bar */
      .topbar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
        flex-wrap:wrap;
      }
      .brand{
        font-family:"Baloo 2","Nunito",sans-serif;
        font-weight:800;
        font-size:clamp(1.35rem,3.4vw,1.9rem);
        letter-spacing:.01em;
        display:flex;
        align-items:center;
        gap:10px;
      }
      .brand .mask{font-size:1.15em;line-height:1}
      .btn-home{
        display:inline-flex;align-items:center;gap:8px;
        font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:1.05rem;
        color:#fff;background:var(--next);text-decoration:none;
        padding:10px 18px;border-radius:999px;min-height:52px;
        box-shadow:0 4px 0 rgba(0,0,0,.18);
        transition:transform .08s ease, background .15s ease;
        -webkit-tap-highlight-color:transparent;touch-action:manipulation;
        white-space:nowrap;
      }
      .btn-home:hover{background:var(--next-dark)}
      .btn-home:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
      .btn-home svg{width:22px;height:22px;flex:none}
      .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .pill{
        background:var(--surface);
        border:2px solid var(--line);
        border-radius:999px;
        padding:8px 14px;
        font-weight:800;
        font-size:.98rem;
        color:var(--muted);
        white-space:nowrap;
      }
      .pill strong{color:var(--ink)}

      /* Stage */
      .stage{
        background:var(--surface);
        border:3px solid var(--line);
        border-radius:26px;
        box-shadow:var(--shadow);
        padding:22px 20px 20px;
        flex:1;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        gap:14px;
        position:relative;
        overflow:hidden;
      }
      .picture{
        font-size:clamp(3.2rem,9vw,5rem);
        line-height:1.1;
        min-height:1.1em;
        filter:drop-shadow(0 4px 8px rgba(0,0,0,.12));
      }
      .picture.pop{animation:picpop .45s ease}
      @keyframes picpop{0%{transform:scale(.6) rotate(-6deg)}60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1)}}
      .sentence{
        font-family:"Baloo 2","Nunito",sans-serif;
        font-weight:800;
        font-size:clamp(2.4rem,7.6vw,4.6rem);
        line-height:1.22;
        letter-spacing:.04em;
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        align-items:center;
        gap:.18em .32em;
        min-height:2.5em;
        max-width:16ch;
        margin:0 auto;
      }
      .word{
        display:inline-block;
        padding:.02em .14em;
        border-radius:.22em;
      }
      .word.newest{
        background:var(--word-bg);
        box-shadow:inset 0 0 0 3px var(--word-line);
        animation:wordpop .38s ease;
      }
      .word.speaking{
        background:var(--word-bg);
        box-shadow:inset 0 0 0 3px var(--word-line);
      }
      @keyframes wordpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
      .slot{
        display:inline-block;
        min-width:2.2ch;
        border-bottom:.14em dashed var(--line);
        color:transparent;
        user-select:none;
      }
      .start-hint{
        font-family:"Baloo 2","Nunito",sans-serif;
        font-size:clamp(1.5rem,4.5vw,2.2rem);
        font-weight:700;
        color:var(--muted);
      }
      .status{
        font-size:clamp(1.05rem,2.6vw,1.3rem);
        font-weight:800;
        color:var(--muted);
        min-height:1.5em;
      }
      .status.good{color:var(--next-dark)}
      @media (prefers-color-scheme: dark){ .status.good{color:#4ade80} }
      .dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
      .dot{width:16px;height:16px;border-radius:50%;background:var(--neutral);border:2px solid var(--line)}
      .dot.on{background:var(--word-line);border-color:var(--word-line)}
      .act{
        display:none;
        background:var(--surface-2);
        border:3px dashed var(--word-line);
        border-radius:16px;
        padding:12px 18px;
        font-family:"Baloo 2","Nunito",sans-serif;
        font-weight:700;
        font-size:clamp(1.15rem,3.2vw,1.55rem);
        max-width:34em;
      }
      .act.show{display:block;animation:wordpop .4s ease}

      /* Controls */
      .controls{display:flex;flex-direction:column;gap:12px}
      .row{display:grid;gap:12px}
      .row.main{grid-template-columns:1.35fr 1fr}
      .row.second{grid-template-columns:1fr 1fr}
      button{
        font-family:"Baloo 2","Nunito",sans-serif;
        font-weight:800;
        border:none;
        cursor:pointer;
        border-radius:var(--radius);
        min-height:68px;
        padding:14px 18px;
        font-size:clamp(1.15rem,3vw,1.45rem);
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        color:#fff;
        box-shadow:0 5px 0 rgba(0,0,0,.18);
        transition:transform .08s ease, box-shadow .08s ease, opacity .15s ease, filter .15s ease;
        -webkit-tap-highlight-color:transparent;
        touch-action:manipulation;
      }
      button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
      button:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
      button:disabled:active{transform:none}
      .btn-next{background:var(--go)} .btn-next:hover:not(:disabled){background:var(--go-dark)}
      .btn-hear{background:var(--hear)} .btn-hear:hover:not(:disabled){background:var(--hear-dark)}
      .btn-read{background:var(--read)} .btn-read:hover:not(:disabled){background:var(--read-dark)}
      .btn-read.ready{animation:pulse 1.1s ease-in-out infinite}
      @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
      .btn-auto{background:var(--neutral);color:var(--neutral-ink);box-shadow:0 5px 0 rgba(0,0,0,.10)}
      .btn-auto.playing{background:#7c4a03;color:#fff}
      @media (prefers-color-scheme: dark){ .btn-auto.playing{background:#92600a} }
      .btn-next-sentence{background:var(--next);width:100%}
      .btn-next-sentence:hover{background:var(--next-dark)}
      .btn-sound{
        background:var(--surface);
        color:var(--ink);
        border:3px solid var(--line);
        box-shadow:none;
        min-height:52px;
        padding:8px 16px;
        font-size:1.02rem;
        border-radius:999px;
      }
      .btn-sound.off{color:var(--muted)}
      .mini-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
      .btn-mini{
        background:transparent;
        color:var(--muted);
        box-shadow:none;
        min-height:48px;
        font-size:1rem;
        padding:8px 14px;
        border-radius:999px;
        border:2px solid var(--line);
      }
      .btn-mini:active{transform:none}
      .tip{
        text-align:center;
        color:var(--muted);
        font-weight:700;
        font-size:.98rem;
        margin:0;
      }
      .confetti-bit{
        position:absolute;
        width:12px;height:16px;
        border-radius:3px;
        pointer-events:none;
        z-index:5;
      }
      @media (max-width:560px){
        .row.main,.row.second{grid-template-columns:1fr}
        .wrap{padding:12px 12px 22px}
        .stage{padding:18px 12px 16px}
        .sentence{max-width:100%}
        button{min-height:64px}
      }
      @media (prefers-reduced-motion: reduce){
        *{animation-duration:.01ms !important;transition-duration:.01ms !important}
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <a class="btn-home" href="https://scaemrfung.github.io/mr-fung-webgames/" aria-label="Home — back to all games">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.1 2.5 11.4c-.4.35-.43.97-.06 1.36.34.37.9.4 1.3.09L5 12.8V20a1.5 1.5 0 0 0 1.5 1.5H10v-6h4v6h3.5A1.5 1.5 0 0 0 19 20v-7.2l1.26 1.05c.4.31.96.28 1.3-.09.37-.39.34-1.01-.06-1.36L12 3.1z"/></svg>
          Home
        </a>
        <div class="brand"><span class="mask" aria-hidden="true">📖</span> Silly Sentence Reader</div>
        <div class="top-right">
          <div class="pill" id="progressPill">Sentence <strong>1</strong> of 20</div>
          <button class="btn-sound" id="soundBtn" type="button" aria-pressed="true">🔊 Sound: On</button>
        </div>
      </div>

      <section class="stage" id="stage" aria-live="polite">
        <div class="picture" id="picture" aria-hidden="true">🐱🎩</div>
        <div class="sentence" id="sentenceBox">
          <span class="start-hint">Tap “Next Word” to start!</span>
        </div>
        <div class="status" id="status">Read each word together, out loud!</div>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="act" id="actBox"></div>
      </section>

      <div class="controls">
        <div class="row main">
          <button class="btn-next" id="nextWordBtn" type="button">Next Word ➜</button>
          <button class="btn-hear" id="hearBtn" type="button" disabled>🔊 Hear It</button>
        </div>
        <div class="row second">
          <button class="btn-auto" id="autoBtn" type="button" aria-pressed="false">▶ Auto Play</button>
          <button class="btn-read" id="readBtn" type="button" disabled>⭐ Read It!</button>
        </div>
        <button class="btn-next-sentence" id="nextSentenceBtn" type="button">Next Sentence ➜</button>
        <div class="mini-row">
          <button class="btn-mini" id="restartBtn" type="button">↺ Start This Sentence Again</button>
        </div>
        <p class="tip">Teacher tip: tap Next Word and read together. When the sentence is done, tap Read It — then everybody acts it out!</p>
      </div>
    </div>

    <script>
      var SENTENCES = [
        { text: "THE CAT WEARS A HAT", pic: "🐱🎩", act: "Act it out: tip your hat like a cat!" },
        { text: "THE DOG EATS A CAKE", pic: "🐶🎂", act: "Act it out: pretend to eat a great big cake!" },
        { text: "THE PIG DANCES IN MUD", pic: "🐷💃", act: "Act it out: dance and wiggle like a happy pig!" },
        { text: "THE FROG HOPS AND SINGS", pic: "🐸🎵", act: "Act it out: hop, hop, hop — and sing like a frog!" },
        { text: "THE COW JUMPS SO HIGH", pic: "🐮☁️", act: "Act it out: jump as high as you can!" },
        { text: "THE DUCK SWIMS IN SOUP", pic: "🦆🍲", act: "Act it out: pretend to swim — splash, splash!" },
        { text: "THE BEAR HUGS A TREE", pic: "🐻🌲", act: "Act it out: give a tree a great big bear hug!" },
        { text: "THE BEE BUZZES BY ME", pic: "🐝💨", act: "Act it out: buzz and fly around like a bee — bzzzzz!" },
        { text: "THE ANT LIFTS A CAKE", pic: "🐜🎂", act: "Act it out: lift something very, very heavy!" },
        { text: "THE GOAT EATS MY SOCK", pic: "🐐🧦", act: "Act it out: oh no — pretend to nibble a sock. Yuck!" },
        { text: "THE FISH BLOWS BIG BUBBLES", pic: "🐟🫧", act: "Act it out: blow great big bubbles — blub, blub!" },
        { text: "THE HEN RUNS TO BED", pic: "🐔🛏️", act: "Act it out: run in place, then pretend to fall asleep!" },
        { text: "THE LION ROARS AT LUNCH", pic: "🦁🍽️", act: "Act it out: roar like a lion — ROAR!" },
        { text: "THE MOUSE SNEAKS BY QUIETLY", pic: "🐭🤫", act: "Act it out: tiptoe past very, very quietly!" },
        { text: "THE OWL STAYS UP LATE", pic: "🦉🌙", act: "Act it out: hoot like an owl — hoo, hoo!" },
        { text: "THE SNAKE SLIDES SO SLOW", pic: "🐍🐌", act: "Act it out: slither slowly like a snake — sssss!" },
        { text: "THE HORSE RUNS SO FAST", pic: "🐴💨", act: "Act it out: gallop fast like a horse!" },
        { text: "THE BUG HUGS A RUG", pic: "🐛❤️", act: "Act it out: give your rug a big, cozy hug!" },
        { text: "THE BAT FLIES AT NIGHT", pic: "🦇🌙", act: "Act it out: flap your wings and fly through the night!" },
        { text: "THE FOX HIDES AND PEEKS", pic: "🦊👀", act: "Act it out: hide your eyes, then peek — peekaboo!" }
      ];

      // Shuffle the sentence order so every class visit feels fresh.
      var order = SENTENCES.map(function(_, i){ return i; });
      for (var i = order.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = order[i]; order[i] = order[j]; order[j] = t;
      }

      var sentencePos = 0;      // position within shuffled order
      var shown = 0;            // words currently shown
      var soundOn = true;
      var autoTimer = null;
      var audioCtx = null;

      var stage = document.getElementById('stage');
      var pictureEl = document.getElementById('picture');
      var sentenceBox = document.getElementById('sentenceBox');
      var statusEl = document.getElementById('status');
      var dotsEl = document.getElementById('dots');
      var actBox = document.getElementById('actBox');
      var pill = document.getElementById('progressPill');
      var nextWordBtn = document.getElementById('nextWordBtn');
      var hearBtn = document.getElementById('hearBtn');
      var readBtn = document.getElementById('readBtn');
      var autoBtn = document.getElementById('autoBtn');
      var nextSentenceBtn = document.getElementById('nextSentenceBtn');
      var restartBtn = document.getElementById('restartBtn');
      var soundBtn = document.getElementById('soundBtn');

      function current() { return SENTENCES[order[sentencePos]]; }
      function words() { return current().text.split(' '); }
      function isDone() { return shown >= words().length; }

      /* ---------- In-browser sounds (Web Audio, no files) ---------- */
      function ac() {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }
      function tone(freq, start, dur, type, vol) {
        if (!soundOn) return;
        var ctx = ac(); if (!ctx) return;
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = type || 'sine';
        o.frequency.value = freq;
        var t0 = ctx.currentTime + start;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0 + dur + 0.05);
      }
      function playPop() { tone(420 + shown * 70, 0, 0.16, 'triangle', 0.22); }
      function playClick() { tone(660, 0, 0.08, 'sine', 0.10); }
      function playSuccess() {
        tone(523, 0, 0.18, 'triangle', 0.2);
        tone(659, 0.12, 0.18, 'triangle', 0.2);
        tone(784, 0.24, 0.2, 'triangle', 0.2);
        tone(1047, 0.36, 0.34, 'triangle', 0.22);
      }

      /* ---------- Speech (in-browser voice) ---------- */
      function speak(text, onWord) {
        if (!soundOn) {
          statusEl.textContent = 'Sound is off — tap “Sound: On” to hear it!';
          statusEl.className = 'status';
          soundBtn.focus();
          return;
        }
        if (!('speechSynthesis' in window)) {
          statusEl.textContent = 'Let’s read it together, out loud!';
          return;
        }
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.rate = 0.82;
        u.pitch = 1.1;
        if (onWord) {
          u.onboundary = function(e) {
            if (e.charIndex == null) return;
            var upto = text.slice(0, e.charIndex).trim();
            var idx = upto === '' ? 0 : upto.split(/\s+/).length - 1;
            onWord(idx);
          };
          u.onend = function(){ onWord(-1); };
          u.onerror = function(){ onWord(-1); };
        }
        window.speechSynthesis.speak(u);
      }

      /* ---------- Rendering ---------- */
      function render() {
        var w = words();
        pill.innerHTML = 'Sentence <strong>' + (sentencePos + 1) + '</strong> of ' + SENTENCES.length;
        pictureEl.textContent = current().pic;

        sentenceBox.innerHTML = '';
        if (shown === 0) {
          var hint = document.createElement('span');
          hint.className = 'start-hint';
          hint.textContent = 'Tap “Next Word” to start!';
          sentenceBox.appendChild(hint);
        } else {
          for (var k = 0; k < shown; k++) {
            var s = document.createElement('span');
            s.className = 'word' + (k === shown - 1 ? ' newest' : '');
            s.textContent = w[k];
            sentenceBox.appendChild(s);
          }
        }
        // Remaining word slots
        for (var r = shown; r < w.length; r++) {
          var slot = document.createElement('span');
          slot.className = 'slot';
          slot.textContent = w[r];
          slot.setAttribute('aria-hidden', 'true');
          sentenceBox.appendChild(slot);
        }
        sentenceBox.setAttribute('aria-label', shown === 0 ? 'No words yet' : w.slice(0, shown).join(' '));

        dotsEl.innerHTML = '';
        for (var d = 0; d < w.length; d++) {
          var dot = document.createElement('span');
          dot.className = 'dot' + (d < shown ? ' on' : '');
          dotsEl.appendChild(dot);
        }

        var done = isDone();
        nextWordBtn.disabled = done;
        nextWordBtn.textContent = done ? 'All Done! 🎉' : 'Next Word ➜';
        hearBtn.disabled = shown === 0;
        readBtn.disabled = !done;
        readBtn.classList.toggle('ready', done);
        actBox.classList.toggle('show', done);
        if (done) actBox.textContent = '🎭 ' + current().act;

        if (shown === 0) {
          statusEl.textContent = 'Read each word together, out loud!';
          statusEl.className = 'status';
        } else if (!done) {
          statusEl.textContent = 'Word ' + shown + ' of ' + w.length + ' — keep going!';
          statusEl.className = 'status';
        }
      }

      function confetti() {
        var colors = ['#e8482f','#f2c94c','#1f6fe0','#0a9a86','#e8930c','#7fb069'];
        for (var n = 0; n < 26; n++) {
          var bit = document.createElement('div');
          bit.className = 'confetti-bit';
          bit.style.background = colors[n % colors.length];
          bit.style.left = (8 + Math.random() * 84) + '%';
          bit.style.top = '-20px';
          stage.appendChild(bit);
          var dx = (Math.random() - 0.5) * 160;
          var fall = stage.offsetHeight * (0.55 + Math.random() * 0.4);
          var rot = Math.random() * 540 - 270;
          bit.animate([
            { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
            { transform: 'translate(' + dx + 'px,' + fall + 'px) rotate(' + rot + 'deg)', opacity: 0.9 }
          ], { duration: 1100 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.4,1)' });
          (function(el){ setTimeout(function(){ el.remove(); }, 1900); })(bit);
        }
      }

      function finishIfDone() {
        if (isDone()) {
          stopAuto();
          statusEl.textContent = 'Great reading! 🎉 Now tap Read It — then act it out!';
          statusEl.className = 'status good';
          playSuccess();
          confetti();
        }
      }

      /* ---------- Actions ---------- */
      function nextWord() {
        if (isDone()) return;
        shown++;
        pictureEl.classList.remove('pop'); void pictureEl.offsetWidth; pictureEl.classList.add('pop');
        render();
        playPop();
        finishIfDone();
      }

      function stopAuto() {
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        autoBtn.textContent = '▶ Auto Play';
        autoBtn.classList.remove('playing');
        autoBtn.setAttribute('aria-pressed', 'false');
      }
      function toggleAuto() {
        if (autoTimer) { stopAuto(); playClick(); return; }
        if (isDone()) return;
        ac();
        autoBtn.textContent = '⏸ Stop Auto Play';
        autoBtn.classList.add('playing');
        autoBtn.setAttribute('aria-pressed', 'true');
        nextWord();
        autoTimer = setInterval(function() {
          if (isDone()) { stopAuto(); return; }
          nextWord();
        }, 1250);
      }

      function loadSentence() {
        stopAuto();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        shown = 0;
        render();
      }

      nextWordBtn.addEventListener('click', function(){ ac(); nextWord(); });

      hearBtn.addEventListener('click', function() {
        if (shown === 0) return;
        var w = words().slice(0, shown);
        statusEl.textContent = 'Listen… 🔊';
        statusEl.className = 'status';
        speak(w.join(' '), null);
      });

      readBtn.addEventListener('click', function() {
        if (!isDone()) return;
        var w = words();
        var spans = sentenceBox.querySelectorAll('.word');
        statusEl.textContent = 'Listen and read along… ⭐';
        statusEl.className = 'status';
        speak(current().text, function(idx) {
          for (var k = 0; k < spans.length; k++) {
            spans[k].classList.toggle('speaking', k === idx);
            spans[k].classList.remove('newest');
          }
          if (idx === -1) {
            statusEl.textContent = 'Great reading! 🎉 Now act it out!';
            statusEl.className = 'status good';
          }
        });
      });

      autoBtn.addEventListener('click', toggleAuto);

      nextSentenceBtn.addEventListener('click', function() {
        playClick();
        sentencePos = (sentencePos + 1) % SENTENCES.length;
        loadSentence();
      });

      restartBtn.addEventListener('click', function() {
        playClick();
        loadSentence();
      });

      soundBtn.addEventListener('click', function() {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? '🔊 Sound: On' : '🔇 Sound: Off';
        soundBtn.classList.toggle('off', !soundOn);
        soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
        if (!soundOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        if (soundOn) playClick();
      });

      // Keyboard: space / arrow-right = next word (handy at the front of class)
      document.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'ArrowRight') {
          if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
          e.preventDefault();
          ac(); nextWord();
        }
      });

      render();
    </script>
  </body>
</html>
