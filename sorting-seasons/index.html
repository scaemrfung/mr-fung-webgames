<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Sorting Seasons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdf6e9;
        --panel: #ffffff;
        --ink: #2b2118;
        --ink-soft: #6b5d4f;
        --line: #e8dcc4;
        --accent: #e8871e;
        --accent-ink: #ffffff;
        --good: #2e9e5b;
        --good-bg: #e2f5e8;
        --warn-bg: #fdeeda;
        --warn-ink: #9a5a12;
        --shadow: 0 6px 0 rgba(43, 33, 24, 0.12), 0 14px 28px rgba(43, 33, 24, 0.10);
        --spring: #58b368; --spring-bg: #e6f7ea;
        --summer: #f2a007; --summer-bg: #fdf0d3;
        --fall:   #d96c33; --fall-bg:   #fbe9dc;
        --winter: #3e7fbf; --winter-bg: #e1eefa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1712;
          --panel: #2a221b;
          --ink: #f7ecdc;
          --ink-soft: #c9b8a3;
          --line: #453829;
          --accent: #f5a83d;
          --accent-ink: #2b1c05;
          --good: #5fce8d;
          --good-bg: #173526;
          --warn-bg: #3d2c12;
          --warn-ink: #ffc978;
          --shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 14px 28px rgba(0, 0, 0, 0.4);
          --spring: #6fce82; --spring-bg: #1d3524;
          --summer: #ffc94d; --summer-bg: #3a2c10;
          --fall:   #f08c4f; --fall-bg:   #3a2415;
          --winter: #6fa8dc; --winter-bg: #1c2f42;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .wrap {
        width: 100%;
        max-width: 1060px;
        padding: 14px 16px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex: 1;
      }

      /* ---------- Top bar ---------- */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .stars {
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 700;
        font-size: clamp(1.25rem, 3.4vw, 1.7rem);
        background: var(--panel);
        border: 3px solid var(--line);
        border-radius: 999px;
        padding: 6px 18px 6px 12px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow);
      }
      .stars .star-ico { font-size: 1.25em; line-height: 1; }
      .progress {
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: clamp(1.05rem, 3vw, 1.35rem);
        color: var(--ink-soft);
        margin-right: auto;
      }
      .tool-btn {
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: clamp(1rem, 2.8vw, 1.2rem);
        border: 3px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 999px;
        padding: 10px 18px;
        min-height: 52px;
        cursor: pointer;
        box-shadow: var(--shadow);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
      }
      .tool-btn:active { transform: translateY(2px); }
      .tool-btn.new-game { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      a.tool-btn { text-decoration: none; }

      /* ---------- Picture stage ---------- */
      .stage {
        background: var(--panel);
        border: 3px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        padding: clamp(16px, 3.5vh, 30px) 18px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .prompt {
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: clamp(1.15rem, 3.4vw, 1.6rem);
        color: var(--ink-soft);
        margin: 0 0 6px;
      }
      .picture {
        font-size: clamp(6.5rem, 24vh, 10.5rem);
        line-height: 1.15;
        display: block;
        user-select: none;
      }
      .picture-name {
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 700;
        font-size: clamp(2rem, 6.5vw, 3.2rem);
        margin: 4px 0 12px;
        letter-spacing: 0.01em;
      }
      .hear-btn {
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: clamp(1.1rem, 3.2vw, 1.45rem);
        background: var(--good);
        color: #ffffff;
        border: none;
        border-radius: 999px;
        padding: 12px 30px;
        min-height: 58px;
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        touch-action: manipulation;
      }
      @media (prefers-color-scheme: dark) { .hear-btn { color: #0d2416; } }
      .hear-btn:active { transform: translateY(2px); }

      /* ---------- Feedback ---------- */
      .feedback {
        min-height: 2.4em;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 600;
        font-size: clamp(1.3rem, 4vw, 1.9rem);
        border-radius: 18px;
        padding: 8px 16px;
      }
      .feedback.good { background: var(--good-bg); color: var(--good); }
      .feedback.try { background: var(--warn-bg); color: var(--warn-ink); }

      /* ---------- Season bins ---------- */
      .bins {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      @media (min-width: 760px) {
        .bins { grid-template-columns: repeat(4, 1fr); }
      }
      .bin {
        font-family: "Fredoka", "Nunito", sans-serif;
        border-radius: 24px;
        border: 4px solid;
        padding: 16px 8px 14px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-height: 132px;
        justify-content: center;
        box-shadow: var(--shadow);
        touch-action: manipulation;
        transition: transform 0.12s ease;
        color: var(--ink);
      }
      .bin:active { transform: scale(0.97); }
      .bin .bin-ico { font-size: clamp(2.6rem, 8vw, 3.6rem); line-height: 1.1; }
      .bin .bin-name { font-weight: 700; font-size: clamp(1.5rem, 4.6vw, 2.1rem); }
      .bin.spring { background: var(--spring-bg); border-color: var(--spring); }
      .bin.summer { background: var(--summer-bg); border-color: var(--summer); }
      .bin.fall   { background: var(--fall-bg);   border-color: var(--fall); }
      .bin.winter { background: var(--winter-bg); border-color: var(--winter); }
      .bin.right {
        outline: 5px solid var(--good);
        outline-offset: 2px;
        transform: scale(1.04);
      }
      .bin:disabled { cursor: default; opacity: 0.92; }
      .bin.shake { animation: shake 0.45s ease; }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-9px); }
        40% { transform: translateX(9px); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
      }

      /* ---------- Finish panel ---------- */
      .finish {
        background: var(--panel);
        border: 3px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        padding: 30px 20px 34px;
        text-align: center;
      }
      .finish .big-star { font-size: clamp(4rem, 14vw, 6rem); line-height: 1.1; }
      .finish h2 {
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 700;
        font-size: clamp(2rem, 6.5vw, 3.2rem);
        margin: 8px 0 6px;
      }
      .finish p {
        font-size: clamp(1.2rem, 3.6vw, 1.6rem);
        font-weight: 800;
        color: var(--ink-soft);
        margin: 0 0 22px;
      }
      .play-again {
        font-family: "Fredoka", "Nunito", sans-serif;
        font-weight: 700;
        font-size: clamp(1.3rem, 4vw, 1.7rem);
        background: var(--accent);
        color: var(--accent-ink);
        border: none;
        border-radius: 999px;
        padding: 16px 42px;
        min-height: 66px;
        cursor: pointer;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
        touch-action: manipulation;
      }
      .play-again:active { transform: translateY(3px); }

      [hidden] { display: none !important; }

      /* ---------- Confetti ---------- */
      .confetti-bit {
        position: fixed;
        top: -4vh;
        width: 12px;
        height: 18px;
        border-radius: 3px;
        z-index: 60;
        pointer-events: none;
        animation: fall linear forwards;
      }
      @keyframes fall {
        to { transform: translateY(112vh) rotate(660deg); }
      }
      .burst-bit {
        position: fixed;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        z-index: 60;
        pointer-events: none;
      }

      button:focus-visible {
        outline: 4px solid var(--accent);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .bin.shake { animation: none; }
        .bin, .tool-btn, .hear-btn, .play-again { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="wrap" id="gameWrap">
      <div class="topbar">
        <a class="tool-btn" href="https://scaemrfung.github.io/mr-fung-webgames/">🏠 Home</a>
        <span class="stars" aria-label="Stars earned"><span class="star-ico" aria-hidden="true">⭐</span> Stars: <span id="starCount">0</span></span>
        <span class="progress" id="progress">Picture 1 of 32</span>
        <button class="tool-btn" id="soundBtn" type="button" aria-pressed="true">🔊 Sound: On</button>
        <button class="tool-btn new-game" id="newGameBtn" type="button">🔁 New Game</button>
      </div>

      <section class="stage" id="stage" aria-label="Picture to sort">
        <p class="prompt">Which season does this belong to?</p>
        <span class="picture" id="pictureEmoji" aria-hidden="true">⛄</span>
        <div class="picture-name" id="pictureName">Snowman</div>
        <button class="hear-btn" id="hearBtn" type="button">🔊 Hear It</button>
      </section>

      <div class="feedback" id="feedback" role="status" aria-live="polite">Tap the season bin!</div>

      <section class="bins" id="bins" aria-label="Season bins">
        <button class="bin spring" type="button" data-season="spring">
          <span class="bin-ico" aria-hidden="true">🌸</span>
          <span class="bin-name">Spring</span>
        </button>
        <button class="bin summer" type="button" data-season="summer">
          <span class="bin-ico" aria-hidden="true">☀️</span>
          <span class="bin-name">Summer</span>
        </button>
        <button class="bin fall" type="button" data-season="fall">
          <span class="bin-ico" aria-hidden="true">🍁</span>
          <span class="bin-name">Fall</span>
        </button>
        <button class="bin winter" type="button" data-season="winter">
          <span class="bin-ico" aria-hidden="true">❄️</span>
          <span class="bin-name">Winter</span>
        </button>
      </section>

      <section class="finish" id="finish" hidden>
        <div class="big-star" aria-hidden="true">🌟</div>
        <h2>Great Job!</h2>
        <p id="finishText">You sorted all 32 pictures!</p>
        <button class="play-again" id="playAgainBtn" type="button">▶️ Play Again</button>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        var ITEMS = [
          // Spring
          { emoji: "🌷", name: "Tulips", season: "spring", plural: true },
          { emoji: "☂️", name: "Umbrella", season: "spring" },
          { emoji: "🐣", name: "Baby Chick", season: "spring" },
          { emoji: "🌱", name: "Little Sprout", season: "spring" },
          { emoji: "🦋", name: "Butterfly", season: "spring" },
          { emoji: "🌈", name: "Rainbow", season: "spring" },
          { emoji: "👢", name: "Rain Boots", season: "spring", plural: true },
          { emoji: "👗", name: "Flower Dress", season: "spring" },
          // Summer
          { emoji: "😎", name: "Sunglasses", season: "summer", plural: true },
          { emoji: "🍦", name: "Ice Cream", season: "summer" },
          { emoji: "🏖️", name: "Beach Day", season: "summer" },
          { emoji: "🏊", name: "Swimming", season: "summer" },
          { emoji: "🩳", name: "Shorts", season: "summer", plural: true },
          { emoji: "☀️", name: "Hot Sunny Day", season: "summer" },
          { emoji: "🎽", name: "Tank Top", season: "summer" },
          { emoji: "🧢", name: "Ball Cap", season: "summer" },
          // Fall
          { emoji: "🎃", name: "Pumpkin", season: "fall" },
          { emoji: "🍂", name: "Fall Leaves", season: "fall", plural: true },
          { emoji: "🍎", name: "Apples", season: "fall", plural: true },
          { emoji: "🧥", name: "Jacket", season: "fall" },
          { emoji: "🌽", name: "Corn", season: "fall" },
          { emoji: "🌰", name: "Acorn", season: "fall" },
          { emoji: "🥾", name: "Hiking Boots", season: "fall", plural: true },
          { emoji: "🦺", name: "Warm Vest", season: "fall" },
          // Winter
          { emoji: "⛄", name: "Snowman", season: "winter" },
          { emoji: "🧤", name: "Mittens", season: "winter", plural: true },
          { emoji: "🎿", name: "Skis", season: "winter", plural: true },
          { emoji: "❄️", name: "Snowflake", season: "winter" },
          { emoji: "☕", name: "Hot Chocolate", season: "winter" },
          { emoji: "🛷", name: "Sled", season: "winter" },
          { emoji: "🧥", name: "Winter Coat", season: "winter" },
          { emoji: "🧣", name: "Scarf", season: "winter" }
        ];

        var SEASON_NAMES = { spring: "Spring", summer: "Summer", fall: "Fall", winter: "Winter" };
        var CONFETTI_COLORS = ["#58b368", "#f2a007", "#d96c33", "#3e7fbf", "#e8871e", "#e2543e"];
        var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        var order = [];
        var index = 0;
        var stars = 0;
        var locked = false;
        var soundOn = true;
        var audioCtx = null;

        var starCountEl = document.getElementById("starCount");
        var progressEl = document.getElementById("progress");
        var pictureEmojiEl = document.getElementById("pictureEmoji");
        var pictureNameEl = document.getElementById("pictureName");
        var feedbackEl = document.getElementById("feedback");
        var stageEl = document.getElementById("stage");
        var binsEl = document.getElementById("bins");
        var finishEl = document.getElementById("finish");
        var finishTextEl = document.getElementById("finishText");
        var soundBtn = document.getElementById("soundBtn");
        var binButtons = Array.prototype.slice.call(binsEl.querySelectorAll(".bin"));

        function shuffle(arr) {
          var a = arr.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
          }
          return a;
        }

        function current() { return order[index]; }

        /* Plural names ("Apples", "Mittens") take "belong"; singular names take "belongs". */
        function belongVerb(item) { return item.plural ? "belong" : "belongs"; }
        function belongSentence(item) {
          return item.name + " " + belongVerb(item) + " in " + SEASON_NAMES[item.season];
        }

        /* ---------- Sound (Web Audio, in-browser only) ---------- */
        function ensureAudio() {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
          return audioCtx;
        }
        function tone(freq, start, dur, type, vol) {
          if (!soundOn) return;
          var ctx = ensureAudio();
          if (!ctx) return;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = type || "sine";
          osc.frequency.value = freq;
          var t0 = ctx.currentTime + start;
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(vol || 0.22, t0 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t0); osc.stop(t0 + dur + 0.05);
        }
        function happySound() {
          tone(523.25, 0, 0.22, "triangle", 0.25);   // C5
          tone(659.25, 0.1, 0.22, "triangle", 0.25); // E5
          tone(783.99, 0.2, 0.34, "triangle", 0.28);  // G5
          tone(1046.5, 0.3, 0.42, "sine", 0.22);     // C6
        }
        function gentleSound() {
          tone(392, 0, 0.2, "sine", 0.12);  // G4, soft
          tone(329.63, 0.14, 0.28, "sine", 0.1); // E4
        }
        function fanfareSound() {
          var seq = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
          for (var i = 0; i < seq.length; i++) tone(seq[i], i * 0.13, 0.3, "triangle", 0.24);
        }

        /* ---------- Speech ---------- */
        function speak(text) {
          if (!soundOn) return;
          if (!("speechSynthesis" in window)) return;
          try {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.rate = 0.95;
            u.pitch = 1.1;
            window.speechSynthesis.speak(u);
          } catch (e) { /* speech is a bonus; game works without it */ }
        }

        /* ---------- Confetti ---------- */
        function burst(x, y) {
          if (reducedMotion) return;
          for (var i = 0; i < 16; i++) {
            var bit = document.createElement("span");
            bit.className = "burst-bit";
            bit.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
            bit.style.left = x + "px";
            bit.style.top = y + "px";
            document.body.appendChild(bit);
            var ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
            var dist = 60 + Math.random() * 90;
            var dx = Math.cos(ang) * dist;
            var dy = Math.sin(ang) * dist - 40;
            bit.animate([
              { transform: "translate(0,0) scale(1)", opacity: 1 },
              { transform: "translate(" + dx + "px," + (dy + 120) + "px) scale(0.4)", opacity: 0 }
            ], { duration: 750 + Math.random() * 250, easing: "cubic-bezier(.2,.7,.3,1)" });
            (function (el) { setTimeout(function () { el.remove(); }, 1100); })(bit);
          }
        }
        function confettiRain() {
          if (reducedMotion) return;
          for (var i = 0; i < 60; i++) {
            var bit = document.createElement("span");
            bit.className = "confetti-bit";
            bit.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
            bit.style.left = Math.random() * 100 + "vw";
            bit.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
            bit.style.animationDelay = (Math.random() * 0.7) + "s";
            document.body.appendChild(bit);
            (function (el) { setTimeout(function () { el.remove(); }, 4200); })(bit);
          }
        }

        /* ---------- Game flow ---------- */
        function setFeedback(text, kind) {
          feedbackEl.textContent = text;
          feedbackEl.className = "feedback" + (kind ? " " + kind : "");
        }
        function setBinsEnabled(on) {
          binButtons.forEach(function (b) { b.disabled = !on; });
        }
        function showPicture() {
          var item = current();
          pictureEmojiEl.textContent = item.emoji;
          pictureNameEl.textContent = item.name;
          progressEl.textContent = "Picture " + (index + 1) + " of " + order.length;
          setFeedback("Tap the season bin!", "");
          binButtons.forEach(function (b) { b.classList.remove("right"); });
          setBinsEnabled(true);
          locked = false;
        }
        function finishGame() {
          stageEl.hidden = true;
          binsEl.hidden = true;
          setFeedback("", "");
          progressEl.textContent = "All done!";
          finishTextEl.textContent = "You sorted all " + order.length + " pictures and earned " + stars + " stars!";
          finishEl.hidden = false;
          fanfareSound();
          confettiRain();
          speak("Great job! You sorted all the pictures!");
        }
        function onBinTap(btn) {
          if (locked) return;
          ensureAudio();
          var item = current();
          var picked = btn.getAttribute("data-season");
          if (picked === item.season) {
            locked = true;
            stars++;
            starCountEl.textContent = stars;
            btn.classList.add("right");
            setBinsEnabled(false);
            happySound();
            var r = btn.getBoundingClientRect();
            burst(r.left + r.width / 2, r.top + r.height / 2);
            setFeedback("⭐ Yes! " + belongSentence(item) + "!", "good");
            speak("Yes! " + belongSentence(item) + "!");
            setTimeout(function () {
              index++;
              if (index >= order.length) finishGame();
              else showPicture();
            }, 1600);
          } else {
            gentleSound();
            btn.classList.remove("shake");
            void btn.offsetWidth; // restart the shake animation
            btn.classList.add("shake");
            setFeedback("Good try! Look at the picture and try again. 🙂", "try");
          }
        }
        function newGame() {
          order = shuffle(ITEMS);
          index = 0;
          stars = 0;
          starCountEl.textContent = "0";
          finishEl.hidden = true;
          stageEl.hidden = false;
          binsEl.hidden = false;
          if ("speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
          showPicture();
        }

        /* ---------- Wiring ---------- */
        binButtons.forEach(function (btn) {
          btn.addEventListener("click", function () { onBinTap(btn); });
        });
        document.getElementById("newGameBtn").addEventListener("click", function () {
          ensureAudio();
          newGame();
        });
