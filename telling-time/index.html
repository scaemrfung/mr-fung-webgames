<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Telling Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eaf6fb;
        --bg-2: #d7eef8;
        --panel: #ffffff;
        --ink: #173a4d;
        --ink-soft: #4a6b7c;
        --accent: #0e7fa8;
        --accent-ink: #ffffff;
        --choice-bg: #ffffff;
        --choice-border: #bcd9e6;
        --choice-hover: #f2fbff;
        --good: #1d9e57;
        --good-bg: #e2f7ea;
        --gentle: #c96a12;
        --gentle-bg: #fdf0dd;
        --star: #f5a800;
        --clock-face: #ffffff;
        --clock-rim: #0e7fa8;
        --clock-tick: #9fc3d4;
        --clock-num: #173a4d;
        --hour-hand: #e2543e;
        --min-hand: #0e7fa8;
        --pin: #173a4d;
        --shadow: 0 6px 0 rgba(23, 58, 77, 0.12), 0 14px 30px rgba(23, 58, 77, 0.10);
        --btn-shadow: 0 5px 0 rgba(23, 58, 77, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d2230;
          --bg-2: #0a1a26;
          --panel: #16303f;
          --ink: #eaf6fb;
          --ink-soft: #a8c6d4;
          --accent: #38b6de;
          --accent-ink: #08222f;
          --choice-bg: #16303f;
          --choice-border: #2c5468;
          --choice-hover: #1d4055;
          --good: #4ade80;
          --good-bg: #123a28;
          --gentle: #fbbf24;
          --gentle-bg: #3d2f10;
          --star: #ffc933;
          --clock-face: #fdfdf8;
          --clock-rim: #38b6de;
          --clock-tick: #8aa5ae;
          --clock-num: #173a4d;
          --hour-hand: #e2543e;
          --min-hand: #0e7fa8;
          --pin: #173a4d;
          --shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 14px 30px rgba(0, 0, 0, 0.35);
          --btn-shadow: 0 5px 0 rgba(0, 0, 0, 0.45);
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Nunito", system-ui, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--ink);
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 14px 16px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      /* ---------- home bar ---------- */
      .homebar {
        width: 100%;
        display: flex;
        justify-content: flex-start;
      }
      .home-btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 1.2rem;
        line-height: 1;
        text-decoration: none;
        background: var(--accent);
        border: 3px solid var(--accent);
        color: var(--accent-ink);
        border-radius: 999px;
        padding: 11px 22px 11px 16px;
        box-shadow: var(--btn-shadow);
        transition: transform 0.08s ease, background 0.15s ease;
      }
      .home-btn:hover { filter: brightness(1.07); }
      .home-btn:active { transform: translateY(3px); box-shadow: none; }
      .home-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      .home-btn svg { width: 24px; height: 24px; flex: 0 0 auto; }

      /* ---------- top bar ---------- */
      .topbar {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .stars {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        border: 3px solid var(--choice-border);
        border-radius: 999px;
        padding: 6px 18px 6px 12px;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 1.5rem;
        line-height: 1;
        box-shadow: var(--shadow);
      }
      .stars .star-ico { font-size: 1.6rem; color: var(--star); }
      .topbtns { display: flex; flex-wrap: wrap; gap: 8px; }
      .tbtn {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 1.05rem;
        border: 3px solid var(--choice-border);
        background: var(--panel);
        color: var(--ink);
        border-radius: 999px;
        padding: 9px 18px;
        cursor: pointer;
        box-shadow: var(--btn-shadow);
        transition: transform 0.08s ease, background 0.15s ease;
      }
      .tbtn:active { transform: translateY(3px); box-shadow: none; }
      .tbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

      /* ---------- level switch ---------- */
      .levels {
        display: flex;
        gap: 8px;
        background: var(--panel);
        border: 3px solid var(--choice-border);
        border-radius: 999px;
        padding: 5px;
        box-shadow: var(--shadow);
      }
      .lvl {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 1.1rem;
        border: none;
        background: transparent;
        color: var(--ink-soft);
        border-radius: 999px;
        padding: 8px 22px;
        cursor: pointer;
      }
      .lvl.on { background: var(--accent); color: var(--accent-ink); }
      .lvl small { display: block; font-family: "Nunito", sans-serif; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.02em; }

      h1 {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: clamp(1.9rem, 5.5vw, 2.9rem);
        margin: 2px 0 0;
        text-align: center;
        line-height: 1.1;
      }
      .round {
        font-weight: 800;
        color: var(--ink-soft);
        font-size: 1.05rem;
        margin: 0;
      }

      /* ---------- clock ---------- */
      .clock-card {
        background: var(--panel);
        border: 3px solid var(--choice-border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: clamp(10px, 2.5vw, 22px);
        position: relative;
      }
      .clock-card svg { display: block; width: min(72vw, 40vh, 400px); height: auto; }
      @media (min-width: 700px) {
        .clock-card svg { width: min(44vh, 430px); }
      }
      .burst {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
      }
      .burst span {
        position: absolute;
        left: 50%;
        top: 50%;
        font-size: 1.7rem;
        color: var(--star);
        opacity: 0;
      }
      .burst.go span { animation: pop 0.9s ease-out forwards; }
      .burst.go span:nth-child(1) { --dx: -120px; --dy: -110px; }
      .burst.go span:nth-child(2) { --dx: 120px;  --dy: -120px; animation-delay: 0.05s; }
      .burst.go span:nth-child(3) { --dx: -150px; --dy: 30px;  animation-delay: 0.1s; }
      .burst.go span:nth-child(4) { --dx: 150px;  --dy: 40px;  animation-delay: 0.08s; }
      .burst.go span:nth-child(5) { --dx: 0px;    --dy: -160px; animation-delay: 0.12s; }
      .burst.go span:nth-child(6) { --dx: -70px;  --dy: 130px; animation-delay: 0.03s; }
      .burst.go span:nth-child(7) { --dx: 80px;   --dy: 130px; animation-delay: 0.14s; }
      @keyframes pop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        25% { opacity: 1; }
        100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25) rotate(40deg); }
      }

      /* ---------- choices ---------- */
      .choices {
        width: 100%;
        max-width: 680px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      @media (min-width: 640px) {
        .choices { grid-template-columns: repeat(3, 1fr); }
      }
      .choice {
        font-family: "Fredoka", sans-serif;
        background: var(--choice-bg);
        border: 4px solid var(--choice-border);
        border-radius: 20px;
        padding: 14px 8px 12px;
        cursor: pointer;
        color: var(--ink);
        box-shadow: var(--btn-shadow);
        transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.2s ease;
        text-align: center;
      }
      .choice:hover { background: var(--choice-hover); }
      .choice:active { transform: translateY(3px); box-shadow: none; }
      .choice .words { display: block; font-weight: 600; font-size: clamp(1.35rem, 4.5vw, 1.8rem); line-height: 1.15; }
      .choice .digital { display: block; font-family: "Nunito", sans-serif; font-weight: 800; font-size: 1.05rem; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0.04em; }
      .choice.right { border-color: var(--good); background: var(--good-bg); }
      .choice.wrong { border-color: var(--gentle); background: var(--gentle-bg); opacity: 0.55; }
      .choice:disabled { cursor: default; }

      /* ---------- feedback + hear ---------- */
      .feedback {
        min-height: 2.4rem;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: clamp(1.3rem, 4.5vw, 1.7rem);
        text-align: center;
        margin: 0;
      }
      .feedback.good { color: var(--good); }
      .feedback.gentle { color: var(--gentle); }
      .hear {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 1.25rem;
        background: var(--accent);
        color: var(--accent-ink);
        border: 3px solid var(--accent);
        border-radius: 999px;
        padding: 12px 30px;
        cursor: pointer;
        box-shadow: var(--btn-shadow);
        transition: transform 0.08s ease;
      }
      .hear:active { transform: translateY(3px); box-shadow: none; }
      .hint {
        margin: 0;
        color: var(--ink-soft);
        font-weight: 700;
        font-size: 0.95rem;
        text-align: center;
      }

      /* ---------- match mode: stage + digital display ---------- */
      .stage { position: relative; }
      .clock-card[hidden], .digital-card[hidden] { display: none; }
      .digital-card {
        background: var(--panel);
        border: 3px solid var(--choice-border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: clamp(26px, 5vw, 40px) clamp(28px, 7vw, 52px);
        text-align: center;
      }
      .digital-face {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: clamp(3.8rem, 15vw, 6.2rem);
        letter-spacing: 0.06em;
        line-height: 1;
        color: var(--ink);
      }
      .digital-label {
        margin: 12px 0 0;
        font-weight: 800;
        color: var(--ink-soft);
        font-size: 1rem;
      }
      .choice .big-digital {
        display: block;
        font-weight: 700;
        font-size: clamp(2rem, 6vw, 2.6rem);
        letter-spacing: 0.05em;
        line-height: 1.1;
      }
      .choice svg.mini-clock {
        display: block;
        width: 118px;
        height: 118px;
        margin: 2px auto;
      }
      @keyframes wiggle {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
      }
      .wiggle { animation: wiggle 0.3s ease 2; }
      @media (prefers-reduced-motion: reduce) {
        .burst.go span, .wiggle { animation: none; }
        .choice, .tbtn, .hear, .home-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="homebar">
        <a class="home-btn" href="https://scaemrfung.github.io/mr-fung-webgames/" aria-label="Home — back to all games">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.2 9.6V21h13.6V9.6"/><path d="M9.6 21v-6.2h4.8V21"/></svg>
          Home
        </a>
      </div>
      <div class="topbar">
        <div class="stars" aria-label="Stars earned">
          <span class="star-ico" aria-hidden="true">★</span>
          <span id="starCount">0</span>
        </div>
        <div class="topbtns">
          <button class="tbtn" id="soundBtn" type="button" aria-pressed="true">🔊 Sound On</button>
          <button class="tbtn primary" id="newBtn" type="button">↻ New Game</button>
        </div>
      </div>

      <div class="levels" role="group" aria-label="Choose a game">
        <button class="lvl on" id="modeTell" type="button">Tell the Time<small>read the clock</small></button>
        <button class="lvl" id="modeMatch" type="button">Match the Clock<small>analogue ↔ digital</small></button>
      </div>

      <div class="levels" role="group" aria-label="Choose a grade level">
        <button class="lvl on" id="lvl1" type="button">Grade 1<small>o'clock &amp; half past</small></button>
        <button class="lvl" id="lvl2" type="button">Grade 2<small>+ quarter past &amp; to</small></button>
      </div>

      <h1 id="titleEl">What time is it?</h1>
      <p class="round" id="roundLabel">Clock 1</p>

      <div class="stage">
        <div class="clock-card" id="clockCard">
          <svg id="clockSvg" viewBox="0 0 300 300" role="img" aria-label="Analogue clock"></svg>
        </div>
        <div class="digital-card" id="digitalCard" hidden role="img" aria-label="Digital clock">
          <div class="digital-face" id="digitalFace">12:00</div>
          <p class="digital-label">digital clock</p>
        </div>
        <div class="burst" id="burst" aria-hidden="true">
          <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
        </div>
      </div>

      <div class="choices" id="choices"></div>

      <p class="feedback" id="feedback" aria-live="polite"></p>

      <button class="hear" id="hearBtn" type="button">🔊 Hear It</button>
      <p class="hint" id="hintEl">The short hand tells the hour. The long hand tells the minutes.</p>
    </div>

    <script>
      (function () {
        "use strict";

        var NUM_WORDS = ["twelve", "one", "two", "three", "four", "five", "six",
                         "seven", "eight", "nine", "ten", "eleven", "twelve"];

        var mode = "tell";           // "tell": read the clock · "match": analogue ↔ digital
        var matchDir = "a2d";        // match round direction: analogue→digital or digital→analogue
        var grade = 1;               // 1: o'clock + half past · 2: + quarters
        var stars = 0;
        var round = 0;
        var soundOn = true;
        var locked = false;
        var current = null;          // { hour: 1-12, minute: 0|15|30|45 }
        var audioCtx = null;
        var advanceTimer = null;

        var starCountEl = document.getElementById("starCount");
        var roundLabelEl = document.getElementById("roundLabel");
        var feedbackEl = document.getElementById("feedback");
        var choicesEl = document.getElementById("choices");
        var clockSvg = document.getElementById("clockSvg");
        var burstEl = document.getElementById("burst");
        var clockCard = document.getElementById("clockCard");
        var titleEl = document.getElementById("titleEl");
        var hintEl = document.getElementById("hintEl");
        var digitalCard = document.getElementById("digitalCard");
        var digitalFace = document.getElementById("digitalFace");

        /* ---------------- time helpers ---------------- */

        function phrase(t) {
          if (t.minute === 0)  return t.hour + " o'clock";
          if (t.minute === 30) return "half past " + t.hour;
          if (t.minute === 15) return "quarter past " + t.hour;
          return "quarter to " + (t.hour % 12 + 1); // minute 45
        }
        function spoken(t) {
          if (t.minute === 0)  return NUM_WORDS[t.hour] + " o'clock";
          if (t.minute === 30) return "half past " + NUM_WORDS[t.hour];
          if (t.minute === 15) return "quarter past " + NUM_WORDS[t.hour];
          return "quarter to " + NUM_WORDS[t.hour % 12 + 1];
        }
        function digital(t) {
          var m = t.minute === 0 ? "00" : String(t.minute);
          return t.hour + ":" + m;
        }
        function key(t) { return t.hour * 60 + t.minute; }

        function shuffle(arr) {
          for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
          }
          return arr;
        }

        function minutesForGrade() {
          return grade === 1 ? [0, 30] : [0, 15, 30, 45];
        }

        function randomTime() {
          var mins = minutesForGrade();
          return {
            hour: 1 + Math.floor(Math.random() * 12),
            minute: mins[Math.floor(Math.random() * mins.length)]
          };
        }

        function makeChoices(answer) {
          var mins = minutesForGrade();
          var seen = {};
          seen[key(answer)] = true;
          var picks = [answer];
          var guard = 0;
          while (picks.length < 3 && guard < 200) {
            guard++;
            var cand;
            var roll = Math.random();
            if (roll < 0.45) {
              // same minutes, hour off by one
              var dh = Math.random() < 0.5 ? 1 : -1;
              cand = { hour: ((answer.hour - 1 + dh + 12) % 12) + 1, minute: answer.minute };
            } else if (roll < 0.8) {
              // same hour, different minutes
              cand = { hour: answer.hour, minute: mins[Math.floor(Math.random() * mins.length)] };
            } else {
              cand = randomTime();
            }
            if (!seen[key(cand)]) {
              seen[key(cand)] = true;
              picks.push(cand);
            }
          }
          return shuffle(picks);
        }

        /* ---------------- clock drawing ---------------- */

        function polar(cx, cy, r, deg) {
          var rad = (deg - 90) * Math.PI / 180;
          return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
        }

        function clockInner(t) {
          var s = "";
          var C = 150, R = 146;
          // face + rim
          s += '<circle cx="' + C + '" cy="' + C + '" r="' + R + '" fill="var(--clock-face)" stroke="var(--clock-rim)" stroke-width="10"/>';
          // minute ticks
          for (var i = 0; i < 60; i++) {
            var big = i % 5 === 0;
            var p1 = polar(C, C, big ? 118 : 126, i * 6);
            var p2 = polar(C, C, 132, i * 6);
            s += '<line x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) +
                 '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) +
                 '" stroke="var(--clock-tick)" stroke-width="' + (big ? 5 : 2) + '" stroke-linecap="round"/>';
          }
          // numbers
          for (var n = 1; n <= 12; n++) {
            var p = polar(C, C, 96, n * 30);
            s += '<text x="' + p[0].toFixed(1) + '" y="' + p[1].toFixed(1) +
                 '" text-anchor="middle" dominant-baseline="central" ' +
                 'font-family="Fredoka, sans-serif" font-weight="600" font-size="34" fill="var(--clock-num)">' + n + '</text>';
          }
          // hands
          var hourDeg = (t.hour % 12) * 30 + t.minute * 0.5;
          var minDeg = t.minute * 6;
          var hp = polar(C, C, 66, hourDeg);
          var mp = polar(C, C, 104, minDeg);
          s += '<line x1="' + C + '" y1="' + C + '" x2="' + hp[0].toFixed(1) + '" y2="' + hp[1].toFixed(1) +
               '" stroke="var(--hour-hand)" stroke-width="13" stroke-linecap="round"/>';
          s += '<line x1="' + C + '" y1="' + C + '" x2="' + mp[0].toFixed(1) + '" y2="' + mp[1].toFixed(1) +
               '" stroke="var(--min-hand)" stroke-width="9" stroke-linecap="round"/>';
          s += '<circle cx="' + C + '" cy="' + C + '" r="11" fill="var(--pin)" stroke="var(--clock-face)" stroke-width="3"/>';
          return s;
        }

        function drawClock(t) {
          clockSvg.innerHTML = clockInner(t);
          clockSvg.setAttribute("aria-label", "Clock showing " + spoken(t));
        }

        /* ---------------- sound (Web Audio only) ---------------- */

        function ctx() {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
          return audioCtx;
        }
        function tone(freq, start, dur, type, vol) {
          var ac = ctx();
          if (!ac) return;
          var o = ac.createOscillator();
          var g = ac.createGain();
          var t0 = ac.currentTime + start;
          o.type = type || "sine";
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(vol || 0.22, t0 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          o.connect(g); g.connect(ac.destination);
          o.start(t0); o.stop(t0 + dur + 0.05);
        }
        function happySound() {
          if (!soundOn) return;
          tone(523.25, 0,    0.18, "triangle");
          tone(659.25, 0.09, 0.18, "triangle");
          tone(783.99, 0.18, 0.30, "triangle");
        }
        function gentleSound() {
          if (!soundOn) return;
          tone(392.00, 0,    0.16, "sine", 0.15);
          tone(329.63, 0.13, 0.22, "sine", 0.15);
        }

        /* ---------------- speech ---------------- */

        function speakTime() {
          if (!current) return;
          if (!("speechSynthesis" in window)) {
            feedbackEl.textContent = "The time is " + phrase(current) + ".";
            feedbackEl.className = "feedback";
            return;
          }
          try {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance("The time is " + spoken(current) + ".");
            u.rate = 0.92;
            u.pitch = 1.05;
            window.speechSynthesis.speak(u);
          } catch (e) { /* speech unavailable — game continues silently */ }
        }

        /* ---------------- game flow ---------------- */

        function newRound() {
          if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
          locked = false;
          round++;
          feedbackEl.textContent = "";
          feedbackEl.className = "feedback";
          burstEl.classList.remove("go");

          current = randomTime();

          if (mode === "match") {
            matchDir = round % 2 === 1 ? "a2d" : "d2a";
            roundLabelEl.textContent = "Match " + round;
            if (matchDir === "a2d") {
              titleEl.textContent = "Find the matching digital time!";
              hintEl.textContent = "Look at the hands on the clock, then tap the digital time that matches.";
              clockCard.hidden = false;
              digitalCard.hidden = true;
              drawClock(current);
            } else {
              titleEl.textContent = "Find the clock that matches!";
              hintEl.textContent = "Read the digital time, then tap the clock that shows the same time.";
              clockCard.hidden = true;
              digitalCard.hidden = false;
              digitalFace.textContent = digital(current);
              digitalCard.setAttribute("aria-label", "Digital clock showing " + digital(current));
            }
          } else {
            roundLabelEl.textContent = "Clock " + round;
            titleEl.textContent = "What time is it?";
            hintEl.textContent = "The short hand tells the hour. The long hand tells the minutes.";
            clockCard.hidden = false;
            digitalCard.hidden = true;
            drawClock(current);
          }

          choicesEl.innerHTML = "";
          makeChoices(current).forEach(function (t) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "choice";
            if (mode === "match" && matchDir === "a2d") {
              b.innerHTML = '<span class="big-digital">' + digital(t) + '</span>';
              b.setAttribute("aria-label", "Digital time " + digital(t));
            } else if (mode === "match") {
              b.innerHTML = '<svg class="mini-clock" viewBox="0 0 300 300" aria-hidden="true">' + clockInner(t) + '</svg>';
              b.setAttribute("aria-label", "Clock showing " + spoken(t));
            } else {
              b.innerHTML = '<span class="words">' + phrase(t) + '</span>' +
                            '<span class="digital">' + digital(t) + '</span>';
            }
            b.addEventListener("click", function () { pick(b, t); });
            choicesEl.appendChild(b);
          });
        }

        function pick(btn, t) {
          if (locked || btn.disabled) return;
          if (key(t) === key(current)) {
            locked = true;
            stars++;
            starCountEl.textContent = stars;
            btn.classList.add("right");
            var kids = choicesEl.children;
            for (var i = 0; i < kids.length; i++) kids[i].disabled = true;
            feedbackEl.textContent = "★ Great job! It is " + phrase(current) + "!";
            feedbackEl.className = "feedback good";
            happySound();
            burstEl.classList.remove("go");
            // restart the burst animation
            void burstEl.offsetWidth;
            burstEl.classList.add("go");
            advanceTimer = setTimeout(newRound, 1800);
          } else {
            btn.classList.add("wrong");
            btn.disabled = true;
            feedbackEl.textContent = "Good try! Look at the hands and try again.";
            feedbackEl.className = "feedback gentle";
            gentleSound();
            var card = digitalCard.hidden ? clockCard : digitalCard;
            card.classList.remove("wiggle");
            void card.offsetWidth;
            card.classList.add("wiggle");
          }
        }

        function newGame() {
          stars = 0;
          starCountEl.textContent = "0";
          round = 0;
          newRound();
        }

        function setMode(m) {
          mode = m;
          document.getElementById("modeTell").classList.toggle("on", m === "tell");
          document.getElementById("modeMatch").classList.toggle("on", m === "match");
          newGame();
        }

        function setGrade(g) {
          grade = g;
          document.getElementById("lvl1").classList.toggle("on", g === 1);
          document.getElementById("lvl2").classList.toggle("on", g === 2);
          newGame();
        }

        /* ---------------- controls ---------------- */

        document.getElementById("newBtn").addEventListener("click", newGame);
        document.getElementById("modeTell").addEventListener("click", function () { setMode("tell"); });
        document.getElementById("modeMatch").addEventListener("click", function () { setMode("match"); });
        document.getElementById("lvl1").addEventListener("click", function () { setGrade(1); });
        document.getElementById("lvl2").addEventListener("click", function () { setGrade(2); });
        document.getElementById("hearBtn").addEventListener("click", function () {
          ctx(); // unlock audio on the same tap
          speakTime();
        });
        var soundBtn = document.getElementById("soundBtn");
        soundBtn.addEventListener("click", function () {
          soundOn = !soundOn;
          soundBtn.textContent = soundOn ? "🔊 Sound On" : "🔇 Sound Off";
          soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
          if (soundOn) happySound();
        });

        newGame();
      })();
    </script>
  </body>
</html>
