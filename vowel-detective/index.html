<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Vowel Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#FFF6E8;
    --surface:#FFFFFF;
    --surface-2:#FFF1D6;
    --text:#2B2118;
    --muted:#7A6A58;
    --line:#F0DCC0;
    --amber:#E8930C;
    --amber-dark:#C77400;
    --amber-soft:#FFE9B8;
    --teal:#0E7C6B;
    --teal-dark:#0A5E51;
    --teal-soft:#D6F2EB;
    --coral:#E4572E;
    --green:#2E9E4F;
    --green-dark:#1F7A3A;
    --green-soft:#DDF5E3;
    --red-soft:#FFE3D9;
    --star:#FFB800;
    --shadow:0 6px 0 rgba(43,33,24,.10);
    --shadow-lg:0 10px 24px rgba(43,33,24,.12);
    --radius:22px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#1B1712;
      --surface:#2A231C;
      --surface-2:#332A20;
      --text:#FFF6E8;
      --muted:#C9B8A3;
      --line:#4A3D2E;
      --amber:#F5A623;
      --amber-dark:#FFB84D;
      --amber-soft:#4A3610;
      --teal:#2EC4A6;
      --teal-dark:#5ED6BE;
      --teal-soft:#143D36;
      --coral:#FF7A52;
      --green:#4CC96F;
      --green-dark:#6EDB8C;
      --green-soft:#1E4228;
      --red-soft:#4A2A20;
      --shadow:0 6px 0 rgba(0,0,0,.35);
      --shadow-lg:0 10px 24px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Nunito",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;cursor:pointer}
  button:focus-visible{outline:4px solid var(--teal);outline-offset:3px}

  .wrap{max-width:980px;margin:0 auto;padding:14px 16px 28px}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-badge{
    width:52px;height:52px;flex:0 0 52px;border-radius:16px;background:var(--amber);
    display:grid;place-items:center;box-shadow:var(--shadow);
  }
  .brand-badge svg{width:32px;height:32px}
  .brand h1{
    font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(26px,4.5vw,36px);
    line-height:1;margin:0;letter-spacing:.2px;
  }
  .brand p{margin:2px 0 0;color:var(--muted);font-weight:800;font-size:14px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .star-pill{
    display:inline-flex;align-items:center;gap:7px;background:var(--surface);
    border:2px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;
    font-weight:900;font-size:19px;box-shadow:var(--shadow);
  }
  .star-pill svg{width:24px;height:24px;flex:0 0 24px}
  .star-pill.pop{animation:pop .45s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
  .btn{
    border:2px solid var(--line);background:var(--surface);color:var(--text);
    border-radius:999px;padding:10px 16px;font-weight:900;font-size:15px;
    display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow);line-height:1;
  }
  .btn:active{transform:translateY(2px);box-shadow:none}
  .btn svg{width:19px;height:19px;flex:0 0 19px}
  a.btn{text-decoration:none}
  .btn.home{background:var(--amber);border-color:var(--amber-dark);color:#fff}
  @media (prefers-color-scheme: dark){ .btn.home{color:#2B1D05} }
  .btn.primary{background:var(--teal);border-color:var(--teal-dark);color:#fff}
  @media (prefers-color-scheme: dark){ .btn.primary{color:#10201C} }

  /* ---------- Mode switcher ---------- */
  .modes{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--surface);
    border:2px solid var(--line);border-radius:18px;padding:8px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .mode-btn{
    border:3px solid transparent;background:transparent;color:var(--muted);
    border-radius:13px;padding:10px 6px;font-family:"Fredoka",sans-serif;font-weight:600;
    font-size:clamp(14px,2.6vw,18px);line-height:1.15;text-align:center;
  }
  .mode-btn small{display:block;font-family:"Nunito",sans-serif;font-weight:800;font-size:12px;margin-top:2px}
  .mode-btn.active{background:var(--amber-soft);border-color:var(--amber);color:var(--text)}
  .mode-btn:active{transform:scale(.98)}

  /* ---------- Game card ---------- */
  .card{
    position:relative;background:var(--surface);border:2px solid var(--line);
    border-radius:26px;box-shadow:var(--shadow-lg);padding:20px 18px 22px;overflow:hidden;
  }
  .progress-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;
  }
  .progress-text{font-weight:900;color:var(--muted);font-size:15px;letter-spacing:.2px}
  .dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--line)}
  .dot.done{background:var(--star)}
  .dot.now{background:var(--amber);transform:scale(1.25)}

  .prompt{
    text-align:center;font-family:"Fredoka",sans-serif;font-weight:600;
    font-size:clamp(19px,3.4vw,24px);margin:8px 0 2px;
  }
  .prompt .hl{color:var(--amber-dark)}
  .picture{
    text-align:center;font-size:clamp(74px,15vw,108px);line-height:1.1;margin:4px 0 2px;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.12));
  }
  .picture.bounce{animation:bounce .5s ease}
  @keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.13) rotate(-3deg)}70%{transform:scale(1.06) rotate(2deg)}100%{transform:scale(1)}}

  .hear-row{display:flex;justify-content:center;margin:8px 0 14px}
  .hear-btn{
    background:var(--amber);border:2px solid var(--amber-dark);color:#fff;
    border-radius:999px;padding:13px 28px;font-family:"Fredoka",sans-serif;font-weight:600;
    font-size:21px;display:inline-flex;align-items:center;gap:9px;box-shadow:0 5px 0 var(--amber-dark);
  }
  @media (prefers-color-scheme: dark){ .hear-btn{color:#2B1D05} }
  .hear-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--amber-dark)}
  .hear-btn svg{width:25px;height:25px}

  /* Word tiles */
  .word-row{display:flex;justify-content:center;align-items:center;gap:clamp(6px,1.8vw,12px);flex-wrap:nowrap;margin:6px 0 4px}
  .tile{
    width:clamp(52px,11.5vw,84px);height:clamp(64px,14vw,102px);
    display:grid;place-items:center;border-radius:16px;
    background:var(--surface-2);border:3px solid var(--line);
    font-family:"Fredoka",sans-serif;font-weight:700;
    font-size:clamp(38px,8.5vw,62px);line-height:1;color:var(--text);
    user-select:none;
  }
  .tile.blank{
    background:var(--amber-soft);border:3px dashed var(--amber);color:var(--amber-dark);
    font-size:clamp(34px,7.5vw,54px);
  }
  .tile.blank.filled{
    background:var(--green-soft);border:3px solid var(--green);color:var(--green-dark);
    animation:pop .45s ease;
  }
  .tile.space{width:clamp(10px,2vw,18px);background:transparent;border:none}

  .feedback{
    min-height:34px;text-align:center;font-family:"Fredoka",sans-serif;font-weight:600;
    font-size:clamp(19px,3.6vw,25px);margin:12px 0 4px;
  }
  .feedback.good{color:var(--green-dark)}
  .feedback.try{color:var(--coral)}
  .feedback.idle{color:var(--muted);font-family:"Nunito",sans-serif;font-weight:800;font-size:17px}

  /* Vowel buttons */
  .vowels{
    display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,2vw,14px);
    margin-top:12px;
  }
  .vowel-btn{
    border-radius:20px;padding:clamp(14px,3vw,22px) 4px 12px;
    background:var(--teal);border:3px solid var(--teal-dark);color:#fff;
    box-shadow:0 6px 0 var(--teal-dark);
    display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1;
  }
  @media (prefers-color-scheme: dark){ .vowel-btn{color:#0B2420} }
  .vowel-btn .letter{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(36px,8vw,54px)}
  .vowel-btn .sound{font-size:clamp(12px,2.4vw,15px);font-weight:900;opacity:.92}
  .vowel-btn:hover{filter:brightness(1.06)}
  .vowel-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-dark)}
  .vowel-btn.wrong{
    background:var(--surface-2);border-color:var(--line);color:var(--muted);
    box-shadow:none;opacity:.45;cursor:default;transform:none;
  }
  .vowel-btn.correct{
    background:var(--green);border-color:var(--green-dark);box-shadow:0 6px 0 var(--green-dark);color:#fff;
  }
  @media (prefers-color-scheme: dark){ .vowel-btn.correct{color:#0E2413} }
  .vowel-btn:disabled{cursor:default}
  .shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

  .hint-line{text-align:center;color:var(--muted);font-weight:800;font-size:14px;margin:16px 0 0}

  /* ---------- Finish ---------- */
  .finish{display:none;text-align:center;padding:16px 6px 8px}
  .finish.show{display:block}
  .game-area.hide{display:none}
  .finish .big-emoji{font-size:92px;line-height:1.1}
  .finish h2{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(32px,6vw,46px);margin:8px 0 4px}
  .finish p{color:var(--muted);font-weight:800;font-size:18px;margin:0 0 6px}
  .finish .final-stars{
    display:inline-flex;align-items:center;gap:8px;background:var(--amber-soft);
    border:2px solid var(--amber);border-radius:999px;padding:10px 22px;
    font-family:"Fredoka",sans-serif;font-weight:700;font-size:26px;margin:10px 0 18px;
  }
  .finish .final-stars svg{width:30px;height:30px}
  .play-again{
    background:var(--amber);border:2px solid var(--amber-dark);color:#fff;
    border-radius:999px;padding:15px 34px;font-family:"Fredoka",sans-serif;font-weight:600;
    font-size:22px;box-shadow:0 5px 0 var(--amber-dark);display:inline-flex;align-items:center;gap:9px;
  }
  @media (prefers-color-scheme: dark){ .play-again{color:#2B1D05} }
  .play-again:active{transform:translateY(3px);box-shadow:0 2px 0 var(--amber-dark)}

  /* Confetti / star burst pieces */
  .burst-piece{
    position:absolute;pointer-events:none;z-index:5;border-radius:3px;
    animation:burstFly .95s ease-out forwards;
  }
  @keyframes burstFly{
    0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0}
  }
  .float-star{
    position:absolute;pointer-events:none;z-index:6;
    animation:floatUp 1.1s ease-out forwards;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) scale(.6) rotate(0deg);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-92px) scale(1.25) rotate(24deg);opacity:0}
  }

  @media (max-width:560px){
    .wrap{padding:10px 10px 22px}
    .brand p{display:none}
    .controls{width:100%;justify-content:space-between}
    .card{padding:16px 12px 18px;border-radius:20px}
    .vowel-btn{border-radius:16px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none"><circle cx="21" cy="21" r="12" stroke="#fff" stroke-width="5"/><line x1="30" y1="30" x2="42" y2="42" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M15 21 Q21 13 27 21" stroke="#FFE9B8" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg>
      </div>
      <div>
        <h1>Vowel Detective</h1>
        <p>Find the missing vowel!</p>
      </div>
    </div>
    <div class="controls">
      <a class="btn home" href="https://scaemrfung.github.io/mr-fung-webgames/" aria-label="Home — back to all games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        Home
      </a>
      <div class="star-pill" id="starPill" aria-label="Stars earned">
        <svg viewBox="0 0 24 24" fill="#FFB800" stroke="#E8930C" stroke-width="1.2"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
        <span id="starCount">0</span>
      </div>
      <button class="btn" id="soundBtn" type="button" aria-pressed="true"></button>
      <button class="btn primary" id="newGameBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
        New Game
      </button>
    </div>
  </div>

  <div class="modes" role="group" aria-label="Choose vowel type">
    <button class="mode-btn active" type="button" data-mode="short">Short Vowels<small>Grade One</small></button>
    <button class="mode-btn" type="button" data-mode="long">Long Vowels<small>Grade Two</small></button>
    <button class="mode-btn" type="button" data-mode="mixed">Mixed<small>Grades 1 &amp; 2</small></button>
  </div>

  <main class="card" id="card">
    <div class="game-area" id="gameArea">
      <div class="progress-row">
        <div class="progress-text" id="progressText">Word 1 of 12</div>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>

      <div class="prompt">🕵️ Which vowel is <span class="hl">missing</span>?</div>
      <div class="picture" id="picture" aria-hidden="true">🐱</div>

      <div class="hear-row">
        <button class="hear-btn" id="hearBtn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          Hear It
        </button>
      </div>

      <div class="word-row" id="wordRow" aria-live="polite"></div>

      <div class="feedback idle" id="feedback">Tap a vowel to solve the mystery!</div>

      <div class="vowels" id="vowels"></div>

      <p class="hint-line">Listen to the word, then tap the vowel that makes the sound.</p>
    </div>

    <div class="finish" id="finish">
      <div class="big-emoji" aria-hidden="true">🏆</div>
      <h2>Great Detecting!</h2>
      <p id="finishText">You solved every word mystery!</p>
      <div class="final-stars">
        <svg viewBox="0 0 24 24" fill="#FFB800" stroke="#E8930C" stroke-width="1.2"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
        <span id="finalStars">0 stars</span>
      </div>
      <br>
      <button class="play-again" id="playAgainBtn" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
        Play Again
      </button>
    </div>
  </main>

</div>

<script>
(function(){
  "use strict";

  /* ---------- Word banks ----------
     Each word: before + vowel + after === word            */
  var SHORT = [
    {word:"CAT", vowel:"A", before:"C", after:"T", emoji:"🐱"},
    {word:"HAT", vowel:"A", before:"H", after:"T", emoji:"🎩"},
    {word:"MAP", vowel:"A", before:"M", after:"P", emoji:"🗺️"},
    {word:"BAT", vowel:"A", before:"B", after:"T", emoji:"🦇"},
    {word:"JAM", vowel:"A", before:"J", after:"M", emoji:"🍓"},
    {word:"VAN", vowel:"A", before:"V", after:"N", emoji:"🚐"},
    {word:"PEN", vowel:"E", before:"P", after:"N", emoji:"🖊️"},
    {word:"BED", vowel:"E", before:"B", after:"D", emoji:"🛏️"},
    {word:"HEN", vowel:"E", before:"H", after:"N", emoji:"🐔"},
    {word:"NET", vowel:"E", before:"N", after:"T", emoji:"🥅"},
    {word:"JET", vowel:"E", before:"J", after:"T", emoji:"✈️"},
    {word:"WEB", vowel:"E", before:"W", after:"B", emoji:"🕸️"},
    {word:"PIG", vowel:"I", before:"P", after:"G", emoji:"🐷"},
    {word:"PIN", vowel:"I", before:"P", after:"N", emoji:"📌"},
    {word:"SIX", vowel:"I", before:"S", after:"X", emoji:"6️⃣"},
    {word:"LIP", vowel:"I", before:"L", after:"P", emoji:"👄"},
    {word:"FISH", vowel:"I", before:"F", after:"SH", emoji:"🐟"},
    {word:"DOG", vowel:"O", before:"D", after:"G", emoji:"🐶"},
    {word:"BOX", vowel:"O", before:"B", after:"X", emoji:"📦"},
    {word:"FOX", vowel:"O", before:"F", after:"X", emoji:"🦊"},
    {word:"POT", vowel:"O", before:"P", after:"T", emoji:"🪴"},
    {word:"LOG", vowel:"O", before:"L", after:"G", emoji:"🪵"},
    {word:"SUN", vowel:"U", before:"S", after:"N", emoji:"☀️"},
    {word:"CUP", vowel:"U", before:"C", after:"P", emoji:"🥤"},
    {word:"BUG", vowel:"U", before:"B", after:"G", emoji:"🐛"},
    {word:"BUS", vowel:"U", before:"B", after:"S", emoji:"🚌"},
    {word:"MUD", vowel:"U", before:"M", after:"D", emoji:"🟤"}
  ];

  var LONG = [
    {word:"CAKE", vowel:"A", before:"C", after:"KE", emoji:"🎂"},
    {word:"RAIN", vowel:"A", before:"R", after:"IN", emoji:"🌧️"},
    {word:"GATE", vowel:"A", before:"G", after:"TE", emoji:"🚪"},
    {word:"PLANE", vowel:"A", before:"PL", after:"NE", emoji:"✈️"},
    {word:"SNAKE", vowel:"A", before:"SN", after:"KE", emoji:"🐍"},
    {word:"TREE", vowel:"E", before:"TR", after:"E", emoji:"🌳"},
    {word:"SEED", vowel:"E", before:"S", after:"ED", emoji:"🌱"},
    {word:"BEE", vowel:"E", before:"B", after:"E", emoji:"🐝"},
    {word:"FEET", vowel:"E", before:"F", after:"ET", emoji:"🦶"},
    {word:"LEAF", vowel:"E", before:"L", after:"AF", emoji:"🍃"},
    {word:"KITE", vowel:"I", before:"K", after:"TE", emoji:"🪁"},
    {word:"BIKE", vowel:"I", before:"B", after:"KE", emoji:"🚲"},
    {word:"FIVE", vowel:"I", before:"F", after:"VE", emoji:"5️⃣"},
    {word:"TIME", vowel:"I", before:"T", after:"ME", emoji:"⏰"},
    {word:"BOAT", vowel:"O", before:"B", after:"AT", emoji:"⛵"},
    {word:"GOAT", vowel:"O", before:"G", after:"AT", emoji:"🐐"},
    {word:"NOTE", vowel:"O", before:"N", after:"TE", emoji:"🎵"},
    {word:"SNOW", vowel:"O", before:"SN", after:"W", emoji:"❄️"},
    {word:"CUBE", vowel:"U", before:"C", after:"BE", emoji:"🧊"},
    {word:"TUNE", vowel:"U", before:"T", after:"NE", emoji:"🎶"},
    {word:"BLUE", vowel:"U", before:"BL", after:"E", emoji:"🔵"},
    {word:"MULE", vowel:"U", before:"M", after:"LE", emoji:"🐴"}
  ];

  var VOWELS = [
    {letter:"A", shortSound:"ă · cat", longSound:"ā · cake"},
    {letter:"E", shortSound:"ĕ · pen", longSound:"ē · tree"},
    {letter:"I", shortSound:"ĭ · pig", longSound:"ī · kite"},
    {letter:"O", shortSound:"ŏ · dog", longSound:"ō · boat"},
    {letter:"U", shortSound:"ŭ · sun", longSound:"ū · cube"}
  ];

  var ROUND_SIZE = 12;
  var PRAISE = ["Great job!","You got it!","Super detective!","Way to go!","That's right!","Excellent!"];

  /* ---------- State ---------- */
  var mode = "short";
  var deck = [];
  var index = 0;
  var stars = 0;
  var locked = false;
  var triedWrong = {};
  var soundOn = true;
  var audioCtx = null;
  var advanceTimer = null;

  /* ---------- Elements ---------- */
  var starCountEl = document.getElementById("starCount");
  var starPill = document.getElementById("starPill");
  var soundBtn = document.getElementById("soundBtn");
  var progressText = document.getElementById("progressText");
  var dotsEl = document.getElementById("dots");
  var pictureEl = document.getElementById("picture");
  var wordRowEl = document.getElementById("wordRow");
  var feedbackEl = document.getElementById("feedback");
  var vowelsEl = document.getElementById("vowels");
  var gameArea = document.getElementById("gameArea");
  var finishEl = document.getElementById("finish");
  var cardEl = document.getElementById("card");

  var ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>Sound On</span>';
  var ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg><span>Sound Off</span>';

  /* ---------- Helpers ---------- */
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function current(){ return deck[index]; }

  function bankFor(m){
    if (m === "short") return SHORT;
    if (m === "long") return LONG;
    return SHORT.concat(LONG);
  }

  /* ---------- Audio (Web Audio, in-browser only) ---------- */
  function getCtx(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, type, vol){
    if (!soundOn) return;
    var ctx = getCtx(); if (!ctx) return;
    var t = ctx.currentTime + start;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol || 0.22, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  function playHappy(){
    tone(523.25, 0, 0.22, "sine", 0.24);
    tone(659.25, 0.09, 0.22, "sine", 0.24);
    tone(783.99, 0.18, 0.34, "sine", 0.26);
    tone(1046.5, 0.30, 0.40, "triangle", 0.18);
  }
  function playTryAgain(){
    tone(330, 0, 0.20, "sine", 0.14);
    tone(262, 0.14, 0.28, "sine", 0.12);
  }
  function playFanfare(){
    var notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    for (var i = 0; i < notes.length; i++){
      tone(notes[i], i * 0.13, 0.30, "triangle", 0.22);
    }
  }
  function playTap(){
    tone(440, 0, 0.08, "sine", 0.08);
  }

  /* ---------- Speech ---------- */
  function speak(text){
    if (!soundOn) return;
    if (!("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.82;
      u.pitch = 1.08;
      u.lang = "en-CA";
      window.speechSynthesis.speak(u);
    } catch(e){ /* speech unavailable — game still works */ }
  }
  function speakWord(){
    var w = current(); if (!w) return;
    speak(w.word.toLowerCase());
  }

  /* ---------- Rendering ---------- */
  function renderSoundBtn(){
    soundBtn.innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
    soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
    soundBtn.setAttribute("aria-label", soundOn ? "Sound on — tap to turn off" : "Sound off — tap to turn on");
  }

  function renderDots(){
    dotsEl.innerHTML = "";
    for (var i = 0; i < deck.length; i++){
      var d = document.createElement("span");
      d.className = "dot" + (i < index ? " done" : (i === index ? " now" : ""));
      dotsEl.appendChild(d);
    }
  }

  function buildVowelButtons(){
    vowelsEl.innerHTML = "";
    var isLongContext = (mode === "long");
    VOWELS.forEach(function(v){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "vowel-btn";
      b.setAttribute("data-letter", v.letter);
      b.setAttribute("aria-label", "Vowel " + v.letter);
      var letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = v.letter;
      var sound = document.createElement("span");
      sound.className = "sound";
      sound.textContent = isLongContext ? v.longSound : v.shortSound;
      b.appendChild(letter);
      b.appendChild(sound);
      b.addEventListener("click", function(){ onVowel(v.letter, b); });
      vowelsEl.appendChild(b);
    });
  }

  function renderWord(){
    locked = false;
    triedWrong = {};
    var w = current();
    progressText.textContent = "Word " + (index + 1) + " of " + deck.length;
    renderDots();

    pictureEl.textContent = w.emoji;
    pictureEl.classList.remove("bounce");
    void pictureEl.offsetWidth;
    pictureEl.classList.add("bounce");

    // Build tiles: before letters, blank, after letters.
    // Consecutive letters are grouped in one tile per character for clarity,
    // except two-letter chunks (SH, PL, SN, TR, BL) stay as single letters too —
    // we split every character into its own tile so the pattern reads cleanly.
    wordRowEl.innerHTML = "";
    var beforeChars = w.before.split("");
    var afterChars = w.after.split("");
    beforeChars.forEach(function(ch){
      var t = document.createElement("div");
      t.className = "tile"; t.textContent = ch;
      wordRowEl.appendChild(t);
    });
    var blank = document.createElement("div");
    blank.className = "tile blank";
    blank.id = "blankTile";
    blank.textContent = "?";
    blank.setAttribute("aria-label", "Missing vowel");
    wordRowEl.appendChild(blank);
    afterChars.forEach(function(ch){
      var t = document.createElement("div");
      t.className = "tile"; t.textContent = ch;
      wordRowEl.appendChild(t);
    });

    setFeedback("Tap a vowel to solve the mystery!", "idle");
    buildVowelButtons();
  }

  function setFeedback(msg, kind){
    feedbackEl.textContent = msg;
    feedbackEl.className = "feedback " + (kind || "idle");
  }

  /* ---------- Effects ---------- */
  function burst(){
    var colors = ["#E8930C","#0E7C6B","#E4572E","#FFB800","#2E9E4F","#F5A623"];
    var rect = cardEl.getBoundingClientRect();
    var cx = rect.width / 2, cy = 150;
    for (var i = 0; i < 22; i++){
      var p = document.createElement("div");
      p.className = "burst-piece";
      var size = 7 + Math.random() * 8;
      p.style.width = size + "px";
      p.style.height = size * (0.5 + Math.random() * 0.7) + "px";
      p.style.left = cx + "px";
      p.style.top = cy + "px";
      p.style.background = colors[i % colors.length];
      var ang = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 170;
      p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      p.style.setProperty("--dy", (Math.sin(ang) * dist + 70) + "px");
      p.style.setProperty("--rot", (Math.random() * 340 - 170) + "deg");
      cardEl.appendChild(p);
      (function(el){ setTimeout(function(){ el.remove(); }, 1000); })(p);
    }
    // Floating star
    var s = document.createElement("div");
    s.className = "float-star";
    s.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="#FFB800" stroke="#E8930C" stroke-width="1.2"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
    s.style.left = (cx - 22 + (Math.random() * 60 - 30)) + "px";
    s.style.top = (cy + 30) + "px";
    cardEl.appendChild(s);
    setTimeout(function(){ s.remove(); }, 1150);
  }

  /* ---------- Game flow ---------- */
  function onVowel(letter, btn){
    if (locked) return;
    var w = current();
    if (letter === w.vowel){
      locked = true;
      btn.classList.add("correct");
      // Disable all buttons
      var btns = vowelsEl.querySelectorAll(".vowel-btn");
      btns.forEach(function(b){ b.disabled = true; });
      // Fill the blank
      var blank = document.getElementById("blankTile");
      if (blank){
        blank.textContent = letter;
        blank.classList.add("filled");
      }
      // Star
      stars++;
      starCountEl.textContent = stars;
      starPill.classList.remove("pop");
      void starPill.offsetWidth;
      starPill.classList.add("pop");

      var praise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
      setFeedback(praise + " " + w.word + "!", "good");
      playHappy();
      burst();
      speak(w.word.toLowerCase() + "!");

      advanceTimer = setTimeout(nextWord, 1650);
    } else {
      if (triedWrong[letter]) return;
      triedWrong[letter] = true;
      btn.classList.add("wrong");
      btn.disabled = true;
      btn.classList.remove("shake");
      void btn.offsetWidth;
      btn.classList.add("shake");
      playTryAgain();
      var w2 = current();
      setFeedback("Good try! Listen again and pick another vowel.", "try");
      // Re-speak the word gently after a short pause so they can listen for the vowel
      setTimeout(function(){ if (!locked) speakWord(); }, 450);
      void w2;
    }
  }

  function nextWord(){
    index++;
    if (index >= deck.length){
      showFinish();
    } else {
      renderWord();
      setTimeout(speakWord, 250);
    }
  }

  function showFinish(){
    gameArea.classList.add("hide");
    finishEl.classList.add("show");
    document.getElementById("finalStars").textContent = stars + (stars === 1 ? " star" : " stars");
    document.getElementById("finishText").textContent =
      "You solved all " + deck.length + " word mysteries" +
      (mode === "short" ? " with short vowels!" : mode === "long" ? " with long vowels!" : "!");
    playFanfare();
    burst();
    setTimeout(burst, 350);
    speak("Great job, detective! You earned " + stars + " stars!");
  }

  function newGame(){
    if (advanceTimer){ clearTimeout(advanceTimer); advanceTimer = null; }
    if ("speechSynthesis" in window){ try { window.speechSynthesis.cancel(); } catch(e){} }
    stars = 0;
    starCountEl.textContent = "0";
    index = 0;
    deck = shuffle(bankFor(mode)).slice(0, Math.min(ROUND_SIZE, bankFor(mode).length));
    gameArea.classList.remove("hide");
    finishEl.classList.remove("show");
    renderWord();
    setTimeout(speakWord, 300);
  }

  /* ---------- Controls ---------- */
  document.querySelectorAll(".mode-btn").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".mode-btn").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      mode = b.getAttribute("data-mode");
      playTap();
      newGame();
    });
  });

  document.getElementById("newGameBtn").addEventListener("click", function(){
    playTap();
    newGame();
  });
  document.getElementById("playAgainBtn").addEventListener("click", function(){
    playTap();
    newGame();
  });
  document.getElementById("hearBtn").addEventListener("click", function(){
    getCtx();
    // Hear It should work even to repeat the word; if sound was off, still respect toggle for effects but speech is the point of the button — temporarily allow:
    if (!soundOn){
      // Turn speech on for this explicit request without flipping the toggle's effect sounds
      if ("speechSynthesis" in window){
        try {
          window.speechSynthesis.cancel();
          var w = current(); if (!w) return;
          var u = new SpeechSynthesisUtterance(w.word.toLowerCase());
          u.rate = 0.82; u.pitch = 1.08; u.lang = "en-CA";
          window.speechSynthesis.speak(u);
        } catch(e){}
      }
      return;
    }
    speakWord();
  });

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    renderSoundBtn();
    if (!soundOn && "speechSynthesis" in window){
      try { window.speechSynthesis.cancel(); } catch(e){}
    }
    if (soundOn){ getCtx(); playTap(); }
  });

  /* ---------- Start ---------- */
  renderSoundBtn();
  newGame();
})();
</script>
</body>
</html>
